numbered_images: true
image_selection_only: true
draft_outline_only: false
instruction: '任务：审查给定提取稿，依据原文修订为目标概念的最终知识；再从实际图片中选择正确配图。提取稿的陈述和标题都可能有错，不是事实证据。不要输出审核过程。


  先确定每段原文究竟在讲谁，再比较同一对象和条件下是否有冲突，最后写保留下来的知识：


  1. 正文每段都要直接帮助理解目标的身份、性质、机制、条件、区别、限制或有用实例。相关方法、地点或工具本身不是目标。只保留它们用于解释目标的部分，不复述它们的完整历史、其他应用故事或人物生平。实例必须明确叫什么，软件功能和操作必须写软件/模板名。提取稿中的“历史”只指目标自己的历史，不能借此搬入相关方法的其他对象。

  2. 每项事实必须在所引原文中有明确依据；保留对象、地域、时期、适用条件和“可能/似乎”等限定。不补记忆中的知识、数值、国籍或名字。普通句子用自然中文。人物、物质、药品、设备、软件等专名的中文写法必须在原文中实际出现；原文只有外文名称时直接保留原词，不自行翻译，提取稿已有的中文名也必须回查原文。

  3. 有引用仍可能彼此矛盾，必须横向比较所有给定原文。相同对象、相同条件下若分类、数值、排名、反应结论或操作条件不一致，且原文不能解释差异，最终省略该细节；不选更精确、看似权威或出现更多的一方，不自行补条件调和，也不将两说分段都当事实。例如同一物种科名不同就只保留无冲突的属种；同一未细分的碱性条件出现不同产物就不写该条件的产物；同一配制操作水温不同就不写水温。这些示例只用于判断，不能加入没有相关材料的概念。

  4. 逐段核对提取稿，保留原文支持且能解释目标的独立原理、条件、机制、限制和解决方法；删重复但不把内容压成泛泛定义。每个自然段末用实际支持它的【资料N】。不把原文的表述改成范围更大的结论。


  图片直接看真实像素。只选目标身份明确、独立观看不会误认目标且有说明作用的图片；照片身份不明的介绍卡片、同类加工品、背景或配角不用。图表必须知道其变量或对象；遮挡关键内容、近似对象、其他版本需要另写纠正说明才不会误认时不用。比较实际画面去重，保留有用的不同形式，不设图片数量目标。上游caption和模型一致不是证据。


  模型只选择图片编号，不写图注、外形描述、图像名字或视觉知识段，不把图片信息写进正文。程序附回原图、来源及最终编号。实际图片前紧邻的 Image N 对应【图N】。


  输出普通文章，每个主题用“## 标题”，正文逐段引【资料N】。最后如有配图，另写“## 配图”，仅逐行写选中的【图N】，每图一次且不附说明。只剩可靠图片时仅输出配图区；没有图片时只写正文；两者均无可靠内容时写【无可保留知识】及原因。不要JSON、内部ID、网址或来源清单。最后一行【完成】。'
closing_instruction: 逐段审查提取稿，以原文为依据修正，保留有用机制、条件、限制和实例；专名不自行翻译。同对象同条件的原文冲突无法解决时省略细节，不选一方，也不并列当事实。文字逐段引【资料N】；配图区仅选【图N】，不生成图注。最后【完成】。
