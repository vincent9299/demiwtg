      framing 四种可判值为局部特写、完整主体为主、场景为主、多面板，另有无法确认。局部特写指主体只有局部构成画面重点；完整主体为主指一个或一组主要对象大体完整、背景次要；场景为主指多个要素的环境或活动整体构成内容；多面板指拼图、多个独立画格。按当前画面组织方式选一项，不按对象个数机械决定。
      view_tags 标主要主体的可见视角，可多选正面、背面、侧面、俯视、仰视、斜视、内部、剖面；无法判断时仅填无法确认。斜视用于明显的三分之四或斜向视面，而不是所有轻微相机倾斜。多人或多个主体的视角不同时可记录多个有意义的视角，并在 caption 中指明对应对象。缺少稳定正背方向的平面作品、图表或形状不强猜朝向。

      可见性、文字与水印：
      observability_issues 记录影响辨认对象或关系的模糊、遮挡、裁切、目标过小、反光、其他问题，每项给出 affected_area 和 detail。普通景深、正常主体互相叠放只有确实限制观察时才记录；没有观察到问题填空数组。画面没展示某一面不等于发生裁切。细节不清时描述限制，不把看不清当成不存在。
      text.presence 与 watermark.presence 均取有、未观察到、无法确认。图中文字包括图案、标识、印刷品、场景文字和后加文字；text.kind 在有文字时区分场景固有文字、后加说明文字、无法区分，未观察到文字时为 null；text.content 只抄确实可读的内容，不能读清的部分在 detail 说明。
      watermark 指后加的署名、版权、图库商标等覆盖层，不把实物自身商标或棋盘固有文字自动当作水印。填写 location 和 detail，说明是否遮挡主体/细节；覆盖水印上的文字也可同时记入 text。仅靠“照片通常有版权”不能推断水印存在。

      详细描述与输出：
      caption 用数句话至数段保留主体/部件、数量与位置、视角、可见状态与动作、实际关系、关键背景、文字/水印以及观察限制，详略随图片复杂度调整。它应能支持以后重新分析图片，不只重复几个标签。所有描述以本图像素为证据，未知的身份、动作目的或遮挡内容不补猜。
      返回 result.annotations，每张输入图恰好一项，image_number 原样对应后附图片编号。不同图片的对象编号和关系互不通用。

      完整输出结构：
      以下示例仅说明字段形状，所有值由实际图片决定；每个字段都必须存在。无可填的说明用空字符串，未知数量为 null，无关系或观察问题为 []。observability_issues 的每项为 {"type":"上述问题枚举","affected_area":"受影响对象或部位","detail":"具体限制"}；relations 的每项为 {"subject_id":"本图对象ID","object_id":"另一个本图对象ID","type":"上述关系枚举","evidence":"可见依据"}。
      直接输出 JSON 对象，不加 Markdown 代码块。
      {
        "result": {
          "annotations": [
            {
              "image_number": 1,
              "composition": "单个主要对象",
              "objects": [
                {
                  "object_id": "o1",
                  "name": "可确认的常用名称",
                  "location": "画面位置",
                  "visible_features": "可见形态或状态",
                  "count": null
                }
              ],
              "relations": [],
              "framing": "完整主体为主",
              "view_tags": [
                "无法确认"
              ],
              "observability_issues": [],
              "text": {
                "presence": "未观察到",
                "kind": null,
                "content": "",
                "location": "",
                "detail": ""
              },
              "watermark": {
                "presence": "未观察到",
                "location": "",
                "detail": ""
              },
              "caption": "依据实际画面填写完整描述。"
            }
          ]
        }
      }

