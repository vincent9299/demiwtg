schema_version: demiflow_prompt_pack_v2
prompts:
  rubric:
    version: author-exact-rubric-v2
    model: &id001
      name: gpt-6-astra
      transport: openai_compatible
      base_url: http://127.0.0.1:4001/v1
      api_key_env: CURATION_JUDGE_API_KEY
    schema_retries: 0
    template: '{{ instructions }}


      完整业务响应放在JSON的result属性内；不改变业务字段与分数含义。

      以下是实际输入。图像目录中的number与后附图像顺序严格对应。

      {{ payload }}

      {{ images | numbered_image }}

      '
    response_schema: &id002
      type: object
      required:
      - result
      additionalProperties: false
      properties:
        result:
          type: object
          additionalProperties: true
  judge:
    version: author-exact-criterion-judge-v2
    model: *id001
    schema_retries: 0
    template: '{{ instructions }}


      完整业务响应放在JSON的result属性内；不改变业务字段与分数含义。

      以下是实际输入。图像目录中的number与后附图像顺序严格对应。

      {{ payload }}

      {{ images | numbered_image }}

      '
    response_schema: *id002
