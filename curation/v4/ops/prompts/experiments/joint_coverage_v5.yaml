version: joint-coverage-v5
instruction: "将本概念的原文和实际图片整理为完整、紧凑、可追溯的主题知识。不是摘要，也不是逐篇翻译；只依据本次输入，不用记忆补全。\n【先输出材料目录】result对象先写topic_plan数组，再写topics和coverage_note。topic_plan每项为{title,source_ids:[输入source_id]}，这是从原文辨认出的知识主题目录，不是推理过程。逐个查看全部passages的标题/内容，把同主题来源归到同项；一个原文包含多个独立主题时可分属多项。目录必须包含所有相关的独立主题；重复来源归并而不是删除整个主题。没有正文信息的导航或过渡句可以不入目录。\n\
  \  【正文】严格按topic_plan逐项写topics，各项title与目录对应。不能仅列目录而不写正文，不能将几个有完整原文的不同主题含糊映射到一段没有提及它们的“其他”。联合各来源写作。每个独立主题都要有实质正文；无图的主题同等保留。不要只写开头几个主题，不要把不相关主题压入“其他”一段。一个主题可有多个连贯段落，不一句一条。\n\
  合并重复事实与中英文重复资料，而非逐来源各写一遍。保留各主题独有的事实、解释、条件、例外和重要细节；同一机制的多个事例可紧凑并列，背景只讲一次。不复述导语、提问、广告、导航及纯修辞。减少重复表达，不减少独立信息，不用“篇幅有限”跳过完整主题。\n\
  【范围与冲突】区分目标对象、上位类别和具体实例，材料中的泛称不能自动变成目标的属性；保留相关背景时明确其适用范围。不将不确定身份、数量、翻译或因果补成事实。局部实质矛盾单独deferred，保留来源差异，不编造折中；其他独立内容照常保留。概括遇到明确例外，必须保留例外，不能输出无限定的绝对结论。\n\
  【选图】这些是候选图片，不是要求全部保留。先看像素判断对象是否相符，再看能否解释或例证正文，最后比较相近图片的新增信息。保留清晰、相关且提供不同结构、细节、角度、状态或操作情境的图；同一形态仅换背景色、画风、装饰或近似照片，选更清楚的代表，其余不用。不要为增加图片数创造主题或编写猜测。没有合适图的正文照常保留。\n\
  来源标题、图中文字和上游筛选理由都不能认证图中对象。先检查有区分意义的可见结构，若与目标不符则不用。身份不明只能保留范围明确且有价值的视觉观察，不得作为具体对象的实例；不能在limitations写“不确定”同时又用它证明身份。正文涉及的功能不等于静物图展示了该动作；构图或形状相近也不自动证明相同的动作或含义。\n\
  每张实际采用的图片必须生成一个type=image块，并用related_block_ids关联同主题正文。仅写image_refs或在coverage_note声称选图不算输出配图。同一图片在全文只输出一次，相近图片不重复解释相同知识。不设图片数量目标。\n\
  【引用】正文可改写，quote必须原样连续复制对应passages.text，保持简繁、字词、标点，不翻译、拼接或自行补空格。选短而足够支撑陈述的原句；同一段多个事实可有多条引用，但不逐句堆砌背景引文，不复制整篇。重复来源可择一引用；互补事实分别引用。不能靠短引句替整段无依据的扩展背书。\n\
  【输出】严格返回{topic_plan:[{title,source_ids:[]}],topics:[{title,blocks:[]}],coverage_note}。按阅读顺序交错正文与图片。每个主题必须有独立可读正文。\n\
  文字块完整结构：{block_id,type:\"text\",text,citations:[{source_id,quote}],image_refs:[{image_id,region}],status:\"\
  candidate\"或\"deferred\",reason}。\n图片块完整结构：{block_id,type:\"image\",image_id,caption,region,limitations,related_block_ids:[\"\
  同主题文字block_id\"],status:\"candidate\"或\"deferred\",reason}。\nblock_id全文唯一，只使用输入source_id/image_id。文字citations或image_refs至少一项有真实依据；纯图观察不编造文字引文。图片region必填，描述全图就填“整体”，不能省略。caption只描述关键可见内容；reason简短一句，limitations只列必要边界，不重复正文。\n\
  返回前检查：所有独立主题已进入正文；每张采用图都有完整图片块；引文能在所标来源找到；引用和图片ID均来自输入；所有必填字段齐全；完整JSON闭合。\ncoverage_note仅用紧凑的source_id→主题标题映射记录原文覆盖，重复来源共同列出；无关或无法确定的材料说明排除/暂缓原因。按原因归类列出未选image_id。覆盖清单不重述正文，也不能声称合并了正文实际不存在的内容。\n\
  \n  外层只允许result属性，禁止额外输出version等元数据。每个目录项都有对应正文后才能结束。若字数增加，先压缩reason、coverage_note和重复引文，不牺牲独立主题。图像不必覆盖目录全部主题；配图不足不影响目录中的纯文字知识。\n"
