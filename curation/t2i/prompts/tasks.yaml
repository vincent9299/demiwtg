  review_sample:
    version: v2-t2i-sample-review-1-inline-1
    model:
      name: qwen3.8-27b
      transport: openai_compatible
      base_url: http://127.0.0.1:8000/v1
      api_key_env: CURATION_DOWNSTREAM_MODEL_KEY
    schema_retries: 0
    template: |
      你审核一条 T2I 训练候选。独立检查提供的材料和实际像素，不因构题者声称 target_support 或 knowledge_application 就认可。不要修改题目、参考、目标或判据。

      输入分为三种角色：
      - construction_evidence：仅供构题审核的事实依据、原文上下文及支持限制，不自动给作答模型。
      - answer_input：作答模型实际收到的指令、所选正文、参考图像素。图片的 caption、来源、审核文字不属于作答输入。
      - supervision_target：已有的目标图，仅供本次审核和后续监督，不是作答参考，也不是一般知识事实的独立依据。

      逐项检查：
      1. grounded：学习目标和判据有构题材料支持，没有从目标图臆造一般事实；细粒度身份或隐藏特征不能仅凭 caption 确认。
      2. input_sufficient：仅用实际 answer_input 和题目合理要求的模型已学知识，可以理解并完成任务。纯文本 T2I 可以没有参考；考查概念视觉知识无需把答案先写进题面。任务若依赖特定参考、版本或条件，其信息必须实际给出。隐含的构题意图不能当题面要求。
      3. learning_objective_visible：目标像素清楚表现所声称的具体学习内容；不可见、被遮挡或只能猜测的特征不通过。不宣称该样本已经证明模型学会迁移。
      4. instruction_satisfied：目标图满足完整生成指令，而不只是出现了相关概念。文字、数量、属性、场景、条件与关系均需核对。允许指令和判据明确准许的变化，不要求复制参考。
      5. image_quality_usable：分辨率、遮挡、裁切、失真、混淆和图中标记没有破坏本任务的监督信息。不做与本题无关的审美门槛。
      6. nonleaking：作答材料没有包含目标图或实质相同的副本，没有依赖未给作答者的隐藏说明来解释指令。

      学习方向可重叠：概念视觉特征、参考信息应用、条件或关系应用，也可为其他有依据的方向。没有类别配额，不强制额外推理、条件、关系或参考。条件决定适用规则/阶段/版本；关系绑定对象/部件/位置/状态。题面直接指定摆放不能冒充知识推断，不要求不同条件必然出现不同外观。

      按 criteria 的顺序逐条检查目标像素。每项返回一条 observation，说明实际看见什么以及哪里不足；不确定时 satisfied=false。所有检查和所有判据通过，程序才接受样本；不能以整体好看抵消某项失败。

      只输出以下业务 JSON，外层 result 由调用模板规定：
      {"checks":{"grounded":true,"input_sufficient":true,"learning_objective_visible":true,"instruction_satisfied":true,"image_quality_usable":true,"nonleaking":true},"criteria":[{"criterion":1,"satisfied":true,"observation":"具体可见证据；该示例不是预填结论"}],"reason":"说明整体结论；失败时指出具体问题"}


      将上述业务JSON完整放入响应的result属性，不改变业务字段的含义。
      以下是实际任务和资料。image占位项的number对应后面实际图片的顺序；保留各图的角色和支持限制。
      {{ payload | json }}
      {{ images | numbered_image }}
    response_schema:
      type: object
      additionalProperties: false
      required:
      - result
      properties:
        result:
          type: object
          additionalProperties: false
          required:
          - checks
          - criteria
          - reason
          properties:
            checks:
              type: object
              additionalProperties: false
              required:
              - grounded
              - input_sufficient
              - learning_objective_visible
              - instruction_satisfied
              - image_quality_usable
              - nonleaking
              properties:
                grounded:
                  type: boolean
                input_sufficient:
                  type: boolean
                learning_objective_visible:
                  type: boolean
                instruction_satisfied:
                  type: boolean
                image_quality_usable:
                  type: boolean
                nonleaking:
                  type: boolean
            criteria:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - criterion
                - satisfied
                - observation
                properties:
                  criterion:
                    type: integer
                    minimum: 1
                  satisfied:
                    type: boolean
                  observation: &id001
                    type: string
                    minLength: 1
            reason: *id001
