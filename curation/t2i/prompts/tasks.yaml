                      condition:
                        type: string
                      criteria:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - requirement
                          - evidence
                          - observable_region
                          - allowed_variation
                          properties:
                            requirement:
                              type: string
                              minLength: 1
                            evidence:
                              type: array
                              items:
                                type: integer
                                minimum: 1
                              minItems: 1
                            observable_region:
                              type: string
                              minLength: 1
                            allowed_variation:
                              type: string
                              minLength: 1
                      edit_type:
