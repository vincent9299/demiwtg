          type: object
          required:
          - status
          additionalProperties: false
          properties:
            status:
              type: string
              enum:
              - ok
              - insufficient
            candidates:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - task_type
                - learning_objective
                - evidence
                - input_materials
                - reference_selection_reason
                - knowledge_gap
                - knowledge_application
                - draft
                properties:
                  task_type:
                    const: t2i
                    type: string
                  learning_objective:
                    type: string
                    minLength: 1
                  evidence:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                    minItems: 1
                  input_materials:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                  reference_selection_reason:
                    type: string
                    minLength: 1
                  knowledge_gap:
                    type: string
                    minLength: 1
                  knowledge_application:
                    type: string
                    minLength: 1
                  target_candidates:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                    minItems: 1
                  target_support:
                    type: string
                    minLength: 1
                  draft:
                    type: object
                    additionalProperties: false
                    required:
                    - status
                    - instruction
                    - condition
                    - criteria
                    - edit_type
                    - anchor
                    - preserve
                    properties:
                      status:
                        const: ok
