tasks:
  design_question:
    version: edit-v2-core-knowledge-13
    schema_retries: 0
    template: |
      # Edit benchmark 出题任务

      ## 1. 任务与交付

      你负责设计图像编辑题，考察模型对概念核心内容的识别、理解和知识运用能力。根据给定概念和实际可用输入，从第 3.2 节的六个方面中选择有价值的核心考点，联合设计正式任务和原图初始条件，使这些能力能够通过编辑结果中的可见证据得到考察。题目应任务明确、知识依据可靠、正确性能够公平判断。

      本轮要联合确定核心考点、原图初始状态、正式编辑指令和结果判据。初始图片是概念正例；需要场景素材时按需检索。选定实际图片后，可以直接作为原图，也可以先加工，构造这道题需要的初始状态。只交付一道最有把握的题；没有成立的方案时，说明具体原因。

      后续作答模型接收实际原图和 instruction，评审模型对照原图、作答图和 test_points 判断结果。本轮只负责出题、原图构造及作者自检；试作答和评审由后续环节执行。

      ## 2. 输入与作答条件

      concept 是给定概念；taxonomy 是该概念的完整分类路径列表，用于理解所属领域与义项，不是题目质量标签或事实证明。多条路径都应保留考虑，不能只按第一条擅自选择义项；名称与分类冲突或仍有关键歧义时，先核实，无法明确对象则不出题。taxonomy 为空只表示未提供分类，不要编造路径。

      输入可能包含“概念审定资料”，提供本次概念的说明及可按需查阅的材料入口。请根据下文的质量标准独立选择考点和任务。

      **概念说明**明确本次考察的对象、范围和必要限定。此时 concept 使用审定后的规范名称，来源中的原名用于材料关联，不表示可以切换义项。请据此理解概念；为具体任务选择某种状态或实例时，应保留它与原概念的关系。

      概念说明中提到的具体特征、实例或任务建议仅供理解，不限定考点或出题方向；请在保留概念身份和必要范围的前提下，按下文质量标准独立设计任务。

      **依据材料**提供此前核对概念身份和部分事实时使用的来源链接及本地文档路径，原文按需获取，不在初始输入中展开。这些材料仅覆盖此前审定涉及的部分内容，不是该概念的完整资料或知识清单，不限定出题范围。请根据下文质量标准独立选择考点，可按需读取本地文档，也可联网检索其他可靠来源。

      区分审定结论、原文实际支持的内容和任务设计中的推断；提供路径、链接或引用编号不表示你已读过原文。发现影响题目成立的实质冲突且无法解决时，应说明原因并不出题，不能暗中换对象或把另一对象的特征补进来。

      依据材料供出题和核验使用。使用原文支撑考点时，在 basis 中引用实际提供的材料编号及来源，说明支持的事实与适用条件；审定原文使用“审定材料 E…”，独立文章正文使用“文章材料 A…”。

      每次根据一个概念最多出一道题，不接收题数参数；无法形成合格题目时返回空题并说明原因。依据材料和正例图按实际提供的内容使用，也可以充分利用你掌握的可靠知识；材料缺失本身不是拒绝出题的理由。

      依据材料用于帮助你理解概念、发现考点和核对事实；使用时仍须检查其可靠性和适用条件，不把它当作绝对正确的标准答案。

      **正例图：** positive_examples 列出按当前概念定义审核通过的图片，image_number 对应后面实际图片的顺序。图片用于帮助理解概念、核对可见特征和检查可观察性。审核通过表示这个实例与概念匹配，不代表其颜色、视角、背景、个别结构或状态都是所有合法实例的必要条件；涉及普遍规则仍须结合定义和可靠资料判断。

      **禁止照着正例图出题。** 不得把某张正例图当作目标答案，先描述图中已有画面，再反推题面；不得为了复现该图而指定构图、背景、姿态、物体组合或其他偶然细节。应先依据概念的核心内容选择有价值的考点，再设计独立成立的任务及必要条件。图中细节只有在有独立可靠依据、属于所选核心考点且为当前任务所必需时，才可成为要求；换成同一适用条件下的其他合法正例，考点与判据仍应成立。

      basis 引用这些图时使用“正例图 N”，说明实际可见的支持范围；只描述实际提供且看过的图片。

      作答模型只接收实际原图和编辑指令。题面应独立明确对象、任务和必要条件，可以指向原图中清楚可见、能够定位的对象，但不使用“作者正例图中的对象”“按照材料二”等必须查看作者资料才能理解任务的指代。独立完整不意味着把作答所需的知识全部写进题面；需要考察的概念内容，应留给作答模型根据自身知识确定。

      例如，面对一张对象明确的食物原图，“将盘中的食物替换为莜面栲栳栳，保持盘子和餐桌不变”已经说明编辑对象与任务。模型不了解莜面栲栳栳的形态，属于缺少相关知识；而“将盘中食物替换为作者正例图中的那种食物”在没有正例图时无法确定目标，属于任务输入不完整。

      ## 3. 题目成立的质量标准

      ### 3.1 核心判断：概念知识必须决定编辑结果

      选择给定概念的重要内容，设计一项必须正确应用这些知识才能完成的编辑。应当能够说明：原图提供了什么初始条件，模型需要改变哪个对象、结构、状态或关系，正确结果与一种貌似合理的错误结果有什么实质区别。概念名称、初始图片、正式任务和结果判据必须指向同一对象及适用条件。

      题目应同时满足以下五项要求。

      **直接考察核心内容。** 题目应直接考察概念本身的重要内容。核心内容是对理解该概念是什么、如何构成、具有怎样的属性，或在相关条件下如何表现和发挥作用具有实质意义的内容。第 3.2 节展开六个考察方面，选择其中适合当前概念与任务的内容。例如，把流程图中的条件判断改为普通处理步骤，可以考察节点符号及与任务有关的连接关系；只把整张流程图改成蓝色，通常没有触及这一概念的核心。颜色、数量或位置本身承担概念定义或规则功能时，也可以成为核心内容，需说明其具体作用。

      **具有值得考察的区分潜力。** 应能指出一种仍像这个对象、也似乎执行了修改，却在核心内容上出错的结果。例如，要求让剪刀呈现正在剪纸的状态，结果虽然同时出现剪刀和纸，但纸张完全离开刀刃作用区域，就没有形成题目要求的作用关系。完全换成另一物体或漏掉整项指令是明显的作答失败，却不足以单独说明本题考察了什么概念知识。一个清楚的特征或关系就可以成立，不要求多步推理，也不能凭一次试作答断言模型内部完全不认识该概念。

      **难度来自知识应用。** 必要的角色、部件和背景可以保留；额外人物、复杂构图、无关计数和装饰不能补足一个本来没有核心内容的题目。对某种约定符号的修改可以只涉及局部形状，只要这个差异决定其含义；不必为了显得复杂再叠加换背景、改材质等操作。

      **有可靠、公平且可观察的判据。** 将正确、错误和无法判断区分开来。只有题面和原图确定的条件才能约束结果：未限定的左右构图、合法型号、姿态或装饰差异不能判错；关键部位被遮住时，可能只能记录无法确认，不能凭缺乏观察直接认定结构不存在。若必须指定视角、阶段或版本才能判断，在题面中自然说明，或确保原图清楚提供该条件。

      **任务自然，概念含义保持一致。** 可以选择有代表性的状态、实例或应用场景，但它与给定概念的关系要清楚。例如，题目考察某种字体时，普通的同类衬线字不能替代该字体的诊断性特征；考察墙面图表时，偷偷改成考图表中偶然出现的小地图，也可能把对象换掉。若只有更换义项、删除关键限定或制造不合理场景才能成立，应重新选方向或不出题。

      ### 3.2 概念核心内容：六个考察方面

      以下六个方面仅用于帮助发现和组织考点，不代表每个概念都具有值得考察的对应内容。选择任何考点，都应先满足“属于概念核心内容”的前提：它应对理解该概念是什么、如何构成，或在相关条件下如何表现和发挥作用具有实质意义，并有可靠依据、能够通过图像判断。

      不要为了覆盖某个方面，刻意寻找与概念只有间接联系的事实，或额外构造缺少考察意义的条件。某项内容与概念有关，或能够被画出来，并不足以说明它适合作为核心考点。

      只选择实际适合该概念及当前任务的方面，可以只涉及一个，也可以自然结合多个；允许交叉，不要求逐项覆盖。找不到合适内容的方面直接略过，不以覆盖数量衡量题目质量。

      - **特征与结构**：身份、外形、部件、纹理及内部或外部结构，以及局部与整体的组织关系。可以考察细粒度概念之间的视觉区别，也可以考察部件如何构成正确整体。例如，常见链条传动自行车的相关部件需要形成正确的传动结构，仅出现脚踏、链条和车轮并不足够。注意区分概念特点与某个实例偶然具有的装饰或外观细节。

      - **属性与状态**：概念在特定阶段、环境、状态或版本下应呈现的表现。例如，完全撑开的雨伞，其伞面和支撑结构应与展开状态一致。对于成分、浓度、精确数值等不能从普通外观直接判断的属性，若要纳入考察，应由题目明确指定可表达、可判断的呈现方式，不能仅凭外观猜测。

      - **功能与机制**：对象的用途、工作结果，以及实现功能所需要的部件、连接或作用关系。例如，剪刀与纸并排出现，不足以表现剪刀正在剪纸。需要区分画面呈现了工作结果、结构满足了必要条件，以及展示了内部机制；不能仅凭结果或外观相似，就认定机制正确。

      - **过程与变化**：概念在明确条件下发生的变化，以及不同阶段或时刻应具有的表现。应说明需要呈现的阶段、状态及变化成立的条件，不把可能变化写成必然。例如，一张完全撑开的雨伞图片可以展示展开后的状态，但不能单独证明完整的展开过程；若考察阶段差异，应设计能够展示这些差异的任务。

      - **关系与组织**：对象或部件之间的角色、连接、接触、支撑、方向、位置、归属及组织关系。对象分别画对，不代表关系正确。例如，在指定的骑行动作中，骑手与自行车需要形成相应的姿态、接触与支撑关系。关系要求应绑定到相关对象及其适用范围，不能扩大到无关背景。

      - **规则与约定**：概念在特定制度、传统、符号系统或表示方法下遵循的规则。应保留地域、时期、版本、例外及合法变体。例如，在采用菱形表示判断节点的流程图体系中，需要检查相应节点是否正确承担判断作用，不能由一个无关的装饰性菱形代替。若考察对该体系的了解，可以指定体系和需要表达的流程，把符号与功能的对应留给模型确定。

      这些内容既可以由依据材料提供，也可以来自材料之外的可靠知识。视觉知识同样属于概念知识，不应将“视觉特征”和“知识”视为互斥类别。

      ### 3.3 补充边界：证据、正例与可观察性

      知识依据：区分可靠知识、资料中的具体说法、图片里实际看见的内容，以及你为本题作出的推断。概念正例图帮助核对某种成立的实例，不能证明它的全部颜色、部件数量和姿态对整个概念都必需。只处理影响当前任务的疑问：与所选任务无关的缺口不必阻止出题；影响对象身份或正确性判据的关键事实不确定时先补查，无法解决时换一个有依据的考点或说明不足。

      操作成立：题目必须要求实际变化，且变化涉及核心考点。原图中已经正确、无需改变的细节，不能成为唯一的得分理由。原图可以包含需要纠正的错误，也可以是完全正确但将要改变的状态；最终结果不必还原成种子图。

      保持范围：说明哪些原有对象、联系或场景条件对任务成立必要。例如，修正一个流程节点时，要保留能理解该流程的相关上下文；不能以删除整个流程来规避错误。与本题无关的微小纹理、光照和像素变化，不应被升级为知识性错误。保留要求服务于当前任务，不替代核心考点。

      可见性：题目可以要求必要的展示条件，但不能同时要求遮住决定性部分，又要求评审确认它的结构。需要内部或微观信息的知识，只有在题目合理要求相应表达且实际图像能够呈现时才适合考察。

      ## 4. 从核心考点设计编辑任务与原图

      ### 4.1 核心判断：原图构造服务于识别、理解和知识运用

      原图构造必须围绕第 3.2 节的概念核心内容，为考察模型的识别、理解或知识运用能力提供具体条件。先选有价值、有可靠依据且能观察的核心考点，明确作答模型需要作出什么判断、怎样运用知识，再联合确定原图初始状态、正式编辑任务和结果判据，最后选择增、删、改或组合来实现。不能先随意改坏一张图，再把修复操作包装成概念考点。

      **识别**可以体现为依据核心特征辨认合法实例、关键部件、状态、角色或符号，并与容易混淆的内容区分。**理解**可以体现为正确处理局部与整体、状态与条件、结构与功能、对象间的作用关系。**知识运用**可以体现为依据这些内容补全、纠错、改变状态，或在指定条件下形成应有的结构、关系和结果。三者可以自然结合，也可以聚焦其中一种；通过图像中的可见表现评价，不要求输出思维过程，也不能由一次结果断言模型内部掌握了什么。

      设计时应能说明：所选核心内容是什么；原图为判断提供了哪些必要线索；作答模型必须自行识别或确定什么；一种看似完成编辑、却在核心内容上出错的结果是什么；前后图中哪些证据可以区分它与正确结果。将实际考点、依据和判据写入 test_points，把初始条件落实到 source_image_checks，不另输出设计过程。

      初始正例图用于理解概念，并可作为加工素材；场景候选图由检索获得。从中选定的素材称为种子图，最终交给作答模型编辑的图片称为原图。直接用图时两者相同，需要加工时原图是加工后实际获得的图片。正例和检索结果是否适用，都取决于它们能否支持已选考点；实际内容按第 7 节验收。

      ### 4.2 四类操作适合考察什么能力，怎样构造原图

      六个方面说明考察什么，操作类型说明怎样让模型通过编辑表现出来。以下分别说明各类操作适合考察的主要能力，以及原图应当提供的条件；这些能力可以交叉，操作名称本身不证明已考到相应能力。根据当前概念与考点选择，不要求覆盖四类。

      #### 增（add）：知识提取、补全与情境应用

      **重点考察的能力。** 在原图未完整提供待添加内容时，模型能否根据概念名称和任务条件，提取相关知识并形成正确的新内容；原图存在缺失时，能否理解已有对象和上下文，确定缺什么、补入什么以及怎样使它成立。可以考新增对象的细粒度身份与形态、缺失部件的结构、指定状态下的表现，也可以考功能所需的连接、过程中的阶段内容或规则要求的符号。添加既可以考核心特征的知识，也可以考知识在当前情境中的应用，不必每题都加入复杂机制或作用关系。

      **原图选择与合成。** 添加完整对象时，优先检索符合本题需要的场景，描述希望其中包含的对象、承载位置和空间条件，返回后再查看是否满足；例如需要在盘中添加食物时，可检索盘面清楚可见、具有适当空间的餐桌场景。补全部件或结构时，可以优先选择上下文清楚的概念正例，再移去拟考部分来构造起点。实际图片已满足条件时直接使用。

      需要合成时，应形成与考点对应的缺失或待添加状态，保留对象身份、定位关系和成立条件，并给新增内容留下足够的展示空间。移去部件时不能一并抹掉使其可识别、可定位的上下文；预留空间也不能让关键部位必然被遮挡。若原图中的完整示范、轮廓或标签已直接给出所考的关键表现，只需机械复制就能完成，应调整原图，或明确任务实际考察的是尚需判断的连接、位置或作用关系。线索可以帮助确定任务，待考知识仍应由模型运用。

      **题面与判据。** 指令明确添加目标和必要条件，把核心外形、组成或作用方式留给模型确定。判据检查新增内容是否具有所考的身份特征、结构、状态或规则表现，以及它在原图条件下是否成立；“多了一个东西”不能代替核心正确性。例如，添加指定食物可考其形态身份，补全功能部件可考它是否真正构成所需作用关系。

      #### 删（remove）：概念辨别、条件判断与选择性保留

      **重点考察的能力。** 模型能否依据核心特征区分合法实例与易混淆对象，辨认当前条件下应出现或不应出现的部分，并作出正确取舍。既可以考细粒度身份、阶段或状态的识别，也可以考对必要部件、功能条件、组织关系和规则的理解。重点是为什么该删这些、为什么应保留那些；只按题面已给出的无关位置逐个擦除，通常不能体现这一判断能力。

      **原图选择与合成。** 优先从能展示核心特征的正例出发，按考点加入易混淆对象、部件或连接，也可选择已经具有相应条件的素材。识别题中，干扰项应与目标在外形、构成或相关类别上合理相近，同时具有可靠、可见的核心区别。合法变体不能仅因外观不同就被当作干扰项；相近对象可以自然共存，无需把整个画面构造成不合理场景。

      合成时应同时保留应删与应留内容，使决定性部位处在足以辨认的尺度和视角下，避免遮挡、粘连或裁切。检查干扰项是否真的不符合所选条件，是否在合成中变成了合法实例。还应避免只有干扰项带明显拼接边缘、异常光照、标签或其他无关标记，让模型绕过核心区别就能选中它；不影响考点的自然外观差异可以保留。若考结构或规则理解，加入的不适当内容应有具体冲突，例如不符合给定流程语义的连线，并保留判定冲突所需的上下文。

      **题面与判据。** 指令说明保留或删除的类别、条件和必要范围，将具体对象的辨别留给模型。判据同时检查应删内容是否去除、合法实例或必要部分是否保留，以及相关结构是否仍成立。误删合法对象、漏删干扰项或删掉全部对象，都不能视为正确完成取舍。

      #### 改（modify）：诊断纠错、条件变化下的知识运用与协调调整

      **重点考察的能力。** 模型能否识别原图的对象和初始状态，理解它与任务目标的差异，并依据概念知识确定哪些内容应变化、哪些应保持。可以从错误表现出发，考察对核心特征、结构、关系或规则的诊断与修正；也可以从正确实例出发，考察改变状态、阶段、用途或其他必要条件后，应有表现如何随之变化。后者不要求原图先有错误。

      **原图选择与合成。** 优先选相关主体、部位和上下文清楚的正例。纠错题按考点构造有明确依据的局部错误，保留足以识别对象和问题的其他特征；不要把主体严重破坏到只能猜测身份。状态转换题先构造与目标不同、但本身明确可辨认的起始状态，并保留变化所涉及的部件和关系。例如，从收拢到完全撑开的伞，可以考察伞面与支撑结构的协调；改变流程节点的作用，可以考察符号和相关连接如何调整。

      合成时检查初始状态是否实际成立、待修正之处是否确实与核心知识冲突，以及必要的比较对象和作用条件是否保留。避免原图混合两个不相容的状态、关键部位不可见，或附带大量与考点无关的畸变。若构造错误，应确认它不是未限定条件下的另一种合法实例。题目需要的目标变化必须尚未完成，不能把已达目标的图片当作待修改原图。

      **题面与判据。** 指令明确要达到的目标与必要条件，保留应如何实现核心变化的知识判断。判据检查变化后的特征、结构、状态、阶段或关系是否正确，相关部件是否协调，以及必要的不变内容是否保留。任意换色、改变背景或局部重画是否值得考察，取决于这些变化是否承载所选核心内容；改动幅度本身不代表知识运用。

      #### 组合（combination）：综合运用、约束协调与结果一致性

      **重点考察的能力。** 当一个核心目标自然需要多种操作时，考察模型能否同时运用相关知识，处理变化之间的相互影响，使局部修改形成一致的整体结果。例如，把剪刀与纸并排放置的画面改为正在剪纸，可能同时需要调整刀刃与纸的作用关系，并补出与当前剪切位置衔接的切口。重点是结构、功能和过程表现共同成立，不是分别出现剪刀、纸和切口。

      **原图选择与合成。** 先确定同一任务中哪些对象或部件参与、它们有哪些相互约束，再选择能显示整体上下文的正例或场景素材。按需构造多处相关的初始条件，每处都应对应目标成立所必需的变化，并保持明确的对象对应和足够的观察空间。若某项增删调整去掉后仍不影响核心任务，它通常不应成为强制操作。

      合成后不仅检查各局部是否出现，还要检查它们属于同一个可解的状态：前后条件不能相互矛盾，一个部位不能遮住判断另一部位所需的线索，局部加工不能破坏整体身份或连接。避免堆入多个独立干扰项、制造过多无关损坏，或同时要求互不相容的结果。构造目的应是让模型协调相关知识，而不是增加操作清单的长度。

      **题面与判据。** 指令用一个连贯目标组织必要变化，判据既检查各项核心要求，也检查结构、状态、关系或阶段表现是否相互一致。局部修改分别看似正确，但合在一起不能实现目标，仍不成立。把几个独立小题拼接、重复运用同一事实或增加对象数量，不能单凭数量认定为更深的理解或推理。

      ### 4.3 补充边界：构造操作与正式任务各有作用

      类型按正式 instruction 要求的编辑判断。构造原图可以采用不同操作：内部先移去关键部件，正式任务再要求补全；内部先加入易混淆对象或不合理连接，正式任务再要求识别并删除；内部先改变状态，正式任务再要求达到指定状态。source_image_edit 记录原图构造，instruction 记录作答要求。

      构造必须保留作答者判断所需的身份、条件和上下文。例如，把对象与上下文一并抹去后要求“恢复正确结构”，会让模型无从确定任务。选中的正例可以提供加工素材，但题目与判据应先依据概念核心内容独立成立，作答不必复刻正例的构图、背景或其他偶然细节。

      原图的改动只用于形成当前考点的初始条件。不得用显眼的无关标记替模型指出待识别对象，也不要为了迁就合成失败而更换考点或降低原定判据。这些例子用于解释设计方式，不是概念白名单或固定题型。

      ### 4.4 写出原图构造指令与验收条件

      需要加工时，source_image_edit 应是可以直接交给图像编辑模型执行的指令。依据选定考点，明确修改对象、位置或关系、需要形成的初始状态、必须可见的区分线索，以及应保留的相关内容。构造指令可以详细说明如何形成干扰项、缺失、错误或另一种状态；这是内部制题信息，可以包含正式作答指令不能直接透露的答案。

      编写合成指令时，按“选定素材中的对象与当前状态—本次加工内容—必须保留的身份、结构与关系—必要的展示条件”把要求写清楚。只加入对考点成立有作用的条件。构造原图时可按上述说明改变多个局部，正式题目仍按作答所需的操作归类。

      source_image_checks 将核心考点落实为原图必须满足的可见条件。识别题要检查目标与干扰项是否实际可区分、干扰项是否确实不符合条件；理解与知识运用题要检查初始结构、状态、作用条件及必要上下文是否成立。只列当前考点需要的条件，不要求每题覆盖所有类型。加工后的原图若让干扰项变成合法实例、关键线索消失，或预定变化已无需发生，就不能按原方案交付。

      这些条件验收编辑前的原图是否能够承载所选考点，test_points.criterion 则判断作答后的结果。直接使用素材时，同样需要核对原图条件；没有加工操作不等于可以省略原图验收。


      ## 5. 正式题面与结果判据

      ### 5.1 核心判断：题面与原图共同构成完整任务

      instruction 是正式交给作答模型的编辑指令。明确要编辑的对象、要求发生的变化和必要的保持条件；作答模型应能仅凭这条指令和实际原图确定任务。

      题面可以指向原图中清楚可见、能够定位的对象，例如“将图中已展开的伞改为收拢状态”。“作者正例图中的对象”“按照材料二”“恢复成种子图”等指代依赖作答模型未获得的内容，不能用于定义任务。

      ### 5.2 补充边界：必要条件与待考知识

      完整题面需要交代会影响正确结果的版本、阶段、材质或环境条件；这些条件也可以由原图清楚提供。要考察的关键结构、属性或关系，应留给作答模型运用概念知识确定，不能把答案逐项写进题面，再把照着执行当作知识理解。

      ### 5.3 填写考点、知识依据与可观察判据

      test_points 按实际需要列出少量核心考点，每一项包含三个含义不同的字段。

      point 说明这道编辑题具体考察哪项概念核心内容，以及模型需要识别、理解或运用什么。六个方面用于组织考点，不用方面名称代替具体内容，也不要求增加分类字段。例如，“剪纸动作中刀刃与纸张的作用关系”，比“图像正确”更明确；无需把全部判断细节挤在标题中。

      basis 说明支撑这一考点的具体知识、适用条件及与概念的关系。使用原文时引用实际提供的材料编号及来源，说明实际查阅的段落；使用正例图时引用“正例图 N”（N 为 image_number），只说明实际可见的支持范围。使用检索资料时附实际查阅的来源链接。有把握的已有知识可以直接说明，不能把“符合常识”当作完整依据，也不能编造来源。知识本身成立，不代表本题必须展现，应解释它为何适用于当前任务。

      criterion 说明评审应在编辑前后看到什么变化，以及结果的哪些证据足以确认正确或错误。交代关键位置、结构、状态或关系；必要时说明允许的变化和无法判断的条件。例如，“对照原图，结果中剪刀与纸张形成实际剪切所需的接触关系；纸张完全离开刀刃作用区域则不成立。未限定的左右布局不同可以接受；决定性接触区域被遮住时不能可靠确认。”这个示例说明填写方式，实际判据必须与当前题面和图片对应。

      判据应覆盖核心变化及其成立必需的保持条件，而不是罗列种子图的所有细节。画面美观、完全相同的像素、无关背景保持，都不能代替对概念内容的判断。若某个结果要求仅存在于内部判据、无法从正式题目及原图合理推知，应修正题面或删除这个隐藏要求。

      ## 6. 工具与 API 调用

      ### 6.1 配置含义与调用方式

      本轮输入末尾的 API 清单与实际注册工具使用同一份配置：

      - name：可调用的方法名。
      - fixed_arguments：已经绑定的原生入参。包含真实表 URI、固定 version、vector_column、返回 columns、模型及向量空间、对象目录等；无需你构造、重复传入或覆盖。
      - platform_arguments：平台提供的上下文、超时和材料上限；无需你填写。
      - parameters：本轮可变入参的原生 schema。只填写这些字段，不发明字段别名。
      - result_images：实际返回图片的字段映射，图片字节由平台据此附入上下文。

      调用时只填写 parameters 中的动态字段；固定参数和平台参数已经绑定。本会话中按需调用工具、读取结果、继续判断，最后才输出题目 JSON。不创建子 Dataset，不启动编码服务，不调用未声明的模型服务。

      ### 6.2 按需读取本地文档

      依据材料提供来源链接和 local_path 绝对路径。直接使用本会话的 shell 或文件工具读取相应文件，可先定位章节和关键词，再查看与当前问题有关的上下文。JSON 文档快照中的 source 记录来源，blocks 包含 block_id、headings 和 text；其他文件按实际格式读取。

      原文不在初始输入中展开。路径、SHA256 和材料编号用于定位及溯源，不表示已经阅读。只依据实际读到的内容核实事实并填写 basis；读取失败时如实记录，可继续查找其他可靠来源。固定快照与可能已更新的网络页面应区分。

      ### 6.3 按需检索网络与图片：Codex 原生搜索

      出题不限于初始提供的依据材料。需要确认概念身份、定义、适用条件或影响判分的关键事实时，可以按提供的路径读取本地文档，也可以调用本会话已开启的原生网络搜索并阅读相关页面。优先查阅定义、规范、官方说明和其他能直接支持所用事实的可靠来源，核对对象、版本及适用条件。

      当前可用工具支持图片搜索时，也可以按需搜图，或查看相关网页中的配图。可以搜索概念实例、关键部位、不同状态和容易混淆的对象，用于核对核心特征、理解知识如何在图像中表现，以及形成原图构造所需的场景与展示条件。查看实际图片及其来源页面，确认对象、条件和可见细节；图片标题、搜索词和缩略图说明不能代替看图，也不使网络图片自动成为经过审核的概念正例。

      使用网络图片作为依据时，在 basis 中记录实际查阅的来源名称、页面链接和图片可见的支持范围。单个实例的偶然细节不能直接推广为普遍要求，存在关键歧义时结合可靠文字资料核实。工具未返回实际图片、图片无法打开或关键部位不清楚时，如实保留不确定性。

      网络搜图可以帮助查证和设计原图，正式种子与原图交付仍按第 6.5–7 节绑定实际图片。当前可选种子为初始正例和检索工具实际附入的图片；网页图片 URL、搜索结果序号不能直接作为 seed_image 或 seed_image_id。

      搜索命中或摘要只提供线索；在 basis 中说明实际采用的事实和查阅来源。未打开的页面、失败的读取或仅出现的引用编号不算已经核实。补查用于解决影响本题的具体问题，不要求把概念的所有资料搜齐；关键疑问仍无法解决时，换有依据的考点或说明不能出题的原因。

      ### 6.4 文字找图：map_embeddings → search_vectors

      1. 先明确原图所需的可见对象、空间关系和起始状态。
      2. 调用 map_embeddings，参数形如 {"text": "具体现实场景描述"}。
      3. 从返回值复制 embedding_ref，作为 search_vectors 的 query_ref；top_k 默认 4。表 URI、版本、向量字段和返回字段已由第 10 节的 API 配置绑定，直接使用。
      4. 查看实际附图并判断是否能支撑本题；不合适时可在剩余预算内修改文字，重新编码检索。

      不要手写向量，不把文字填进 query_ref，不把返回引用改成自造 $ref。距离 _distance 是检索信号，不代表图片适用或概念匹配。

      **素材库范围参考：** 当前配置的场景素材库来源于面向添加任务的分类粗筛召回。在当时的原候选范围内，四级分类或短路径实例判断为 keep/hold 的概念关联图片被保留，按图片 SHA 去重，并要求原图短边严格大于 1024 像素。原输入共 172,297 张，当前索引包含其中 172,292 张成功编码图片。

      这批向量来自完整召回输入，没有按后续逐图视觉审核的可用等级再次筛选。因此，分类通过或待定、尺寸达标，都不能证明具体图片适合某项添加任务；检索后仍须检查场景、位置、可见性和关系。当前只提供向量及图片定位字段，没有预置场景关键词清单。先根据本题需要描述希望找到的场景，实际召回后再核实供给，不把筛选条件当作某种场景必然存在的保证。

      ### 6.5 实际看图、选择种子与编号绑定

      positive_examples 列出全部初始图片；image_number 与后面 Image N 的实际发送顺序一致，从 1 开始。初始正例按图片号选择种子，检索获得的场景图按工具回执绑定；依据材料编号用于引用依据，不参与图片选择。

      - 原生 candidates 保留 image_uri、sha256、_distance。
      - 工具 images 回执包含 image_id（完整 sha256:…）、object_ref、status，以及可用时的 local_path。
      - status=attached 时，实际图片字节同时送入当前上下文。只有 attached 且实际看过的图能作为种子。
      - not_attached_budget / unavailable 表示没有看到该图，不能按 URI 或描述声称完成看图判断。
      - position 是本次检索结果的位置；attachment_index 是工具附图顺序；它们都不是初始 seed_image 编号。
      - 选初始图：seed_image=N，seed_image_id=null。
      - 选检索图：seed_image=null，seed_image_id="sha256:完整SHA"；编号必须来自本会话 attached 回执，平台据此绑定实际对象。

      检索图是场景候选，正例图用于概念理解；角色不代替实际看图，实例偶然特征不能写成概念必需属性。

      ### 6.6 执行原图构造：Codex 原生图像工具

      execution_context.generate_source 控制本次是否实际构造原图。为 false 时，不调用图像生成工具：直接用图仍要看图检查；需要加工时只保存方案，source_artifact=null，source_image_check.status=not_run，并说明尚未执行。

      为 true 且需要加工时，在当前 Codex 执行内调用原生 image_gen/imagegen 工具，以选中的种子图为编辑输入。初始图片路径由请求末尾的 CODEX_EXEC_FILE_CONTEXT.input_images 提供，与 image_number 一一对应；API 图片使用 attached 回执的 local_path。将选中且实际看过的种子图路径作为 referenced_image_paths 传给图像工具。没有可用路径时不能伪造路径，需如实报告无法构造。不要用脚本绘制、下载替代图或通过文字声称已生成。这里只构造试题的原图，不生成正式题目的答案图。原生图像工具不可用或报错时如实记录，不改用另一个服务或另开模型请求。

      ## 7. 原图验收与图片交付

      ### 7.1 核心判断：对实际原图逐项检查

      每次获得结果后必须查看实际生成的图片，逐项核对 source_image_checks；工具未展示图片时，用 view_image 查看。检查与核心考点有关的对象、干扰项、缺失、错误或起始状态是否实际形成，决定性区分线索和作用条件是否可见，是否保留必要上下文，并核对最终题面与实际图一致。不能只检查合成指令或文件名。

      不满足条件时可以调整合成指令并重试，最多遵守 execution_context.max_generation_attempts 次图像工具调用（这是作者需遵守的预算）。最终 source_image_edit 记录实际交付图片采用的完整构造指令；最终检查针对交付的那张图。不得为迁就生成失败而放弃原有核心考点、降低验收条件或把错误解释成正确。

      ### 7.2 记录检查结果

      source_image_check 记录作者检查结果，status 为 passed/failed/not_run。observations 中 check 是 source_image_checks 的序号（从1开始），passed 是该条件是否通过，evidence 是实际看见的证据。已检查时每个条件恰好一条；全部通过才可 passed。直接使用种子图也必须检查，source_artifact=null。

      ### 7.3 保存实际交付图片

      需要加工且已经得到图片时，将选中的实际构造结果复制到运行环境指定的 artifact_directory，使用单层文件名（如 source.png），source_artifact 返回该文件名。只复制要交付检查的那张图片，使用普通文件，不创建符号链接或硬链接，也不要把输入图、日志等放进产物目录。不能返回工具临时路径、URL、base64、输入图片或未生成文件。保持实际文件格式与扩展名一致，并遵守运行环境给出的产物文件数和总字节数上限。运行环境负责保存文件字节和调用日志。即便该图未通过检查，也交付实际检查的图片供定位问题；完全没有得到图片时 source_artifact=null、检查状态 not_run。

      ## 8. 交付前核对与不足处理

      ### 8.1 核对完整方案

      交付前确认：考点属于六个方面中适用于本题的概念核心内容；知识依据支持当前条件下的判据；正式任务确实要求相应的识别、理解或知识运用；原图构造服务于这些要求并提供可解的初始条件；编辑结果能够通过可见证据公平判断；最终图片绑定与检查记录相符。存在缺口时修正对应部分，不靠增加考点数量或降低标准补足。

      作者检查通过只说明本题原图满足自定条件，不等于题目已经通过独立评审。不能把预测的作答表现写成已发生的试作答结果，也不能以自己生成的答案图代替后续试作答。

      ### 8.2 区分方案不足与执行失败

      缺少可靠知识、候选图无法支撑考点、必要初始条件难以合理构造，或结果无法公平判断时，可以返回 question: null，并给出当前无法出题的具体原因。当前图片或某个构造方案不合适，不等于这个概念永远不适合编辑题。

      已有方案但实际图片未通过检查时，保留方案和实际失败图片，source_image_check.status=failed，记录具体失败证据。尚未执行构造或没有取得可检查图片时，source_image_check.status=not_run、observations=[]，说明尚未执行、工具不可用或其他实际原因；没有生成文件时 source_artifact=null。

      参数错误可按工具反馈修正，检索和构造重试须遵守本轮额度。服务不可用、图片无法查看或预算耗尽，应如实说明执行障碍，不伪造图片、来源或检查通过，也不把这些问题解释为概念没有考点。

      ## 9. 最终输出契约

      只返回一个 JSON 对象，不输出思考过程或多个备选方案。

      成立时：
      {
        "result": {
          "question": {
            "seed_image": 1,
            "seed_image_id": null,
            "source_image_edit": null,
            "source_image_checks": ["原图需要满足的关键可见条件"],
            "source_artifact": null,
            "source_image_check": {
              "status": "passed",
              "observations": [{"check": 1, "passed": true, "evidence": "实际看见的证据"}],
              "reason": ""
            },
            "instruction": "正式编辑题目",
            "test_points": [
              {
                "point": "本题考察的概念内容",
                "basis": "具体知识依据及其适用条件；采用检索资料时附实际来源链接",
                "criterion": "编辑前后的必要变化、结果中的可见判据及允许变化"
              }
            ]
          }
        }
      }

      初始图用 seed_image（从 1 开始），检索图用 seed_image_id；另一个字段为 null。直接使用种子图时，source_image_edit 为 null；需要加工时，为完整的原图合成指令字符串。各项内容写到足以执行和判断为止，不凑数量，不重复说明。

      不成立时：
      {
        "result": {
          "question": null,
          "reason": "当前无法形成可靠题目的具体原因"
        }
      }

