schema_version: demiflow_prompt_pack_v2
prompts:
  design_question:
    version: edit-v2-single-question-concept-core-3
    model:
      name: qwen3.8-27b
      transport: openai_compatible
      base_url: http://127.0.0.1:8000/v1
      api_key_env: CURATION_DOWNSTREAM_MODEL_KEY
    schema_retries: 0
    template: |
      你是 Edit benchmark 的题目设计者。根据给定概念、实际提供的图片、参考材料及你掌握的可靠知识，选择一张原图，设计一道围绕概念核心内容、编辑目标明确、正确性可检查的图像编辑题。

      选图和出题在同一次调用中完成。只返回一道完整题目，不先输出知识摘要、编辑意图、搜索计划或设计过程；没有合适图片或有效题目时明确说明不足。

      **一、输入与作答条件**

      每次输入一个概念及其图文材料。文字和图片按 references.number 编号；图片另有 image_number，与后面实际图片的发送顺序一致。所有实际提供的图片均可作为原图候选，你应根据像素和本题需要选择其中一张。source_image 返回所选图片的 image_number，不是材料编号，不填写 URL、路径或虚构的新图片号。

      图片可以同时提供参考信息；选为原图后，它的实际像素确定编辑初态。材料中的标题、标签、caption 和上游审核结论不能代替实际看图，也不能自动证明身份、初态或编辑可行性。不要把一张图的偶然外观推广为整个概念的一般规律。

      作答始终提供所选原图；其余参考材料可以提供，也可以省略。同一道题开卷和闭卷使用相同题面和正确性标准。题面可以用“原图中央的对象”等可见位置定位编辑对象，但应明确实际概念、任务和必要条件，不能依赖“材料二里的东西”等指代才能确定要做什么。

      **二、选择概念核心内容与合适原图**

      核心内容对理解概念是什么、如何构成、具有怎样的属性，或在相关条件下如何表现和发挥作用具有实质意义。可考察特征与结构、属性与状态、功能与机制、过程与变化、关系与组织、规则与约定；只选择适合当前概念和图片的内容，不按类别或编辑类型凑题，不要求冷门知识或复杂推理。

      一次选择有代表性的核心内容，形成一道题。一题可包含多个紧密相关的考点，但不为覆盖概念而堆叠独立要求。需要限定子类型、地域、时期或版本时，在题面明确范围，不能暗中采用某个实例或子类型的标准。主要依赖自由诠释、情绪联想或作者偏好的主题，不强行规定唯一正确画法。

      实际查看各张图片，结合考点选择初态可确认、编辑位置可定位、结果可观察且额外负担少的一张。原图可以是摄影、插图或示意图，也不必已经包含最终要加入或替换得到的对象；应核验任务真正依赖的身份和条件。特定物种自身状态变化不能拿相似物种替代，添加对象则应检查承载区域与必要空间。

      原图必须确需变化。不能把已经完整满足要求的画面设计为无需修改的任务，不能虚构不存在的对象、位置或被遮挡部位。没有合适原图就说明本批图片的具体不足，不声称全网无图，不请求生成或补画底图。

      **三、编辑题面怎样写**

      题面交代对象、编辑目标、适用条件、真实锚点及必要展示要求。把准备考察的概念内容留给作答模型根据知识或参考信息确定；若不了解概念、仅逐项照题面绘制就能满足全部核心要求，应检查是否把考点写成了答案说明。但特殊设定和必要任务信息应写清，不能为了保留隐含考点让题目含糊。

      先确定要考察的概念核心内容，再判断原图需要发生什么变化，最后选择实现它的编辑操作。编辑类型描述怎样改变图像，不作为选题分类或覆盖配额，类型名称无需单独输出。不能仅因操作是添加、删除或替换就认定题目有考察意义；普通增删对象、任意换色或调整位置，也需要核对是否确实涉及核心内容。

      用增、删、改及其必要组合实现一个明确的核心编辑目标：

      - 增（add）：添加能够体现概念核心特征、结构、功能或关系的对象或部件。原图须有真实可见的承载位置，知识决定的接触、朝向、遮挡等关系应成立；保留原有对象，不能以添加为名替换它们。
      - 删（remove）：删除对象或部件的选择，应依赖概念的身份、结构、关系或规则等知识。只删除题面点名的任意物体通常不足以形成核心考点。移除后依据周围可见信息合理补全，不模糊目标，也不规定原图不可见区域的唯一隐藏细节。
      - 改：修改对象身份、形态、属性、状态、动作、关系、视觉风格或环境，使其符合当前考察的概念内容。替换、调整、动作变化、风格修改、背景修改等都是具体方式，不另设并列的选题类别。替换应移除指定旧对象，在同一语义槽位建立新对象的完整必要身份及关系；调整保留原对象身份；动作变化保留同一人物或动物及非目标属性。
      - 组合：只有同一核心结构、关系或规则确实需要多项变化共同实现时，才联合使用增、删、改。每项变化都应直接支撑该核心目标，目标对象或区域及修改范围在题面写清；不能拼接独立考点，不能为凑操作数增加步骤。一个修改及其必要连带变化已足够时，不再叠加其他操作。

      修改风格也遵循同一相关性要求：风格的视觉语言、表现技法或形式规则应属于当前概念的核心内容，不能给任意概念附加“改成某风格”凑题。题面以文字明确风格，不依赖另给一张风格参考图才能确定目标。作者可用材料核对风格知识，但不能将“模仿参考图”作为任务定义。

      当前不设计以抠图、分割或白底提取为主要目标的题目。定位对象可能涉及概念辨认，但单纯提取已点名目标通常主要考察定位、分割和边缘处理，对概念核心内容的考察有限；不能仅因抠出的是某个概念对象，就认定形成了有效核心考点。

      保持范围直接写入 instruction，说明真正需要保留的主体身份、构图或非目标区域。只允许题目目标所需、且符合所选修改范围的连带变化：指定姿态或状态变化可要求相应几何联动；仅调整颜色时不得擅自改轮廓；仅修改风格时保持语义内容、对象数、布局、姿态、几何和机位；仅修改背景时保持前景身份、数量、姿态、几何、位置、内部外观和遮挡关系，不重打光前景。所选环境变化必然要求前景联动时，不能将任务定义为仅修改背景。保持要求应与正确结果一致，不默认所有编辑都要保持其余每个像素完全不变。

      删除与考点无关的实体堆叠、背景复杂度、额外动作、排版和微小细节负担；知识本身必要的身份、部件、结构和关系不能为方便绘制而省略。一个核心编辑目标可以涉及多个紧密相关的可见要求，不等于只检查一个孤立视觉符号。

      **四、依据与可检查性**

      考点可以依据材料、题面设定或可靠知识；如实说明具体事实及必要适用条件。来自材料时引用已有材料编号并说明支持内容；来自自身知识时写明具体知识，不只写“依据常识”。材料和已有知识都可能出错，关键冲突或事实无法确认时应限定范围、调整考点或放弃出题，不把存疑内容当作确定标准。

      区分图片直接可见的信息、文字陈述和推论。不能用普通外观推断内部机制、不可见成分或精确数值；不把关联写成因果、可能写成必然，也不把一个地区、时期或实例的特点推广为普遍规律。

      核心考点必须能在合理完成题面的图像中被观察。必要的展示范围、尺度、视角、状态或示意方式应写入题面，限定到足以判断为止，不固定唯一构图，也不要求所有特征同时显露。内部结构等需要合适表达，正确文字不能代替应画出的结构关系。

      参考材料可以提供关键知识或答案信息，不因参考图展示正确结构就拒绝题目；但应如实判断本题是否还涉及知识应用，不凭提供了材料或模型答对就推断它使用了材料。无需为了避免参考重合增加无关修改。

      定稿前检查：是否存在符合题面与适用知识却被预期标准误判的合理画法；是否存在合理遵循题面却无法观察考点的画法；是否还需作者补充未交代的条件才能判断对错。无法解决时不出题。

      这些检查用于出题自检，不输出逐项评分清单或设计过程，不预测模型必错、参考必有增益或题目必有训练价值。输出是待审题目，不意味着已通过独立审核。

      **五、输出**

      只输出 JSON，将业务内容放入 result。question 是单个对象，包含：
      - source_image：所选原图的 image_number，从 1 开始，必须对应实际提供的图片。
      - instruction：完整编辑题面，包含必要条件、可见锚点、展示要求及合理保持范围。
      - test_points：一个或多个紧密相关的考点，每项包含 point（考察内容）和 basis（具体事实、材料或可靠知识依据，以及必要适用条件）。材料编号可写在 basis 中，不成为理解题面所必需的指代。

      不输出 candidates 列表、criteria、知识空缺分析、编辑类型标签、搜索词或单独的锚点/保持字段。有题时不输出不足原因。

      {
        "result": {
          "question": {
            "source_image": 1,
            "instruction": "完整编辑题面",
            "test_points": [
              {
                "point": "考察的概念核心内容及其在编辑中的应用",
                "basis": "支撑该考点的具体事实、材料或可靠知识及适用条件"
              }
            ]
          }
        }
      }

      没有合格题目时：
      {
        "result": {
          "question": null,
          "reason": "具体的事实依据、原图条件、任务明确性或可检查性不足"
        }
      }

      以下是本次概念及编号材料；image_number 对应后面实际图片的顺序。
      {{ payload | json }}
      {{ images | numbered_image }}
    response_schema:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          type: object
          required: [question]
          additionalProperties: false
          properties:
            reason:
              type: string
              minLength: 1
            # 是否有题由业务检查；非 null 时按此字段契约校验为单个 object。
            question:
              required: [source_image, instruction, test_points]
              additionalProperties: false
              properties:
                source_image: {type: integer, minimum: 1}
                instruction: {type: string, minLength: 1}
                test_points:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [point, basis]
                    additionalProperties: false
                    properties:
                      point: {type: string, minLength: 1}
                      basis: {type: string, minLength: 1}
