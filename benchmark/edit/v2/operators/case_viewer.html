<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Edit 出题全过程与评审</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#203047;background:#f4f7fb;font-size:15px;color-scheme:light}*{box-sizing:border-box}body{margin:0}header,main{max-width:1400px;margin:auto;padding:22px}h1{font-size:25px;margin:0 0 10px}h2{font-size:23px;margin:0}h3{font-size:18px;margin:25px 0 12px}h4{font-size:15px;margin:14px 0 7px}p{line-height:1.7}.muted,figcaption{color:#596b81;font-size:13px}.stats,.badges{display:flex;gap:9px;flex-wrap:wrap}.badge{background:#e8eef7;border-radius:6px;padding:6px 10px;font-size:13px}.pass{background:#ddf3e8}.fail,.technical{background:#fde7e6}.partial{background:#fff0d1}.inconclusive{background:#eee9fc}.toolbar{position:sticky;top:0;z-index:3;background:#f4f7fbf5;border-block:1px solid #dce3ed;padding:12px 22px}.controls{max-width:1356px;margin:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;border:1px solid #bcc9d8;border-radius:6px;background:white;padding:7px;color:inherit}button,summary{cursor:pointer}button:disabled{opacity:.4;cursor:default}#search{width:250px}#jump{width:65px}#concept{max-width:300px}.card{background:white;border:1px solid #dce3ed;border-radius:10px;padding:24px;margin-bottom:20px}.text,pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.instruction{background:#f1f6ff;border-left:4px solid #5277b4;padding:15px}.point{border-top:1px solid #e0e7f0;padding:12px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}.gallery{display:flex;flex-wrap:wrap;gap:12px}.gallery figure{width:200px;margin:0;border:1px solid #dce3ed;border-radius:8px;padding:10px}.gallery img{width:100%;height:165px;object-fit:contain;background:#f6f8fb}.selected{outline:2px solid #5886c3}.picture{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#f6f8fb;cursor:zoom-in}.gallery img{cursor:zoom-in}.stage{border:1px solid #dce3ed;border-radius:8px;padding:16px;margin:12px 0}.missing{background:#f6f8fb;padding:18px;border:1px dashed #c9d3e0;white-space:pre-wrap;line-height:1.75}.error{color:#a32b26}.score{font-size:26px;font-weight:650}details{margin:12px 0}summary{color:#315988;padding:5px 0}pre{font-size:12px;background:#f5f7fb;border-radius:6px;padding:12px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #dce3ed;text-align:left;vertical-align:top;padding:10px}a{color:#245fa5}.footer{display:flex;justify-content:center;align-items:center;gap:16px;padding:15px}dialog{border:0;border-radius:10px;max-width:95vw;max-height:95vh;padding:18px}dialog::backdrop{background:#142135a8}dialog img{display:block;max-width:88vw;max-height:78vh;object-fit:contain;margin:10px auto}.remote-preview{max-width:220px;max-height:180px;display:block;margin:8px 0}.actual-input img{max-width:230px;max-height:230px;object-fit:contain}.actual-input .text{font-size:13px}.empty{text-align:center;padding:40px}@media(max-width:850px){.columns{grid-template-columns:1fr}header,main,.toolbar{padding:12px}.card{padding:15px}.gallery figure{width:155px}#search{width:180px}}
</style></head><body>
<header><h1>Edit · 出题过程、原图与评审</h1><p id="summary"></p><div id="stats" class="stats"></div><details><summary>固定版本与展示范围</summary><pre id="metadata"></pre></details></header>
<section class="toolbar"><div class="controls"><input id="search" type="search" placeholder="搜索概念、题面、考点"><select id="status" aria-label="结果筛选"><option value="">全部结果</option><option value="reviewed">已评审</option><option value="technical">技术失败 / 未完成</option><option value="retrieved">使用过场景检索</option><option value="pass">评审通过</option><option value="partial">部分通过</option><option value="fail">作答失败</option><option value="inconclusive">无法判定</option></select><label>每页 <select id="size"><option>1</option><option>3</option><option>5</option></select> 题</label><button id="prev">上一页</button><input id="jump" type="number" min="1" value="1" aria-label="页码"><button id="next">下一页</button><span id="count"></span><select id="concept"><option value="">跳转概念…</option></select><button id="reset">清空筛选</button></div></section>
<main><div id="cases"></div><div class="footer"><button id="bottom-prev">上一页</button><span id="bottom-count"></span><button id="bottom-next">下一页</button></div><p class="muted">按已保存记录展示完整文字和图片；不补做检索、合成或作答。图片为保留完整画面的缩略图，可点击放大查看 URI / SHA。网页缩略图仅在点击加载后联网，不代表模型已经看过该图。技术失败不计为零分。</p></main>
<dialog id="image-dialog"><button id="close-image">关闭</button><img id="large-image" alt="图片预览"><p id="image-note" class="text"></p><a id="original-link" target="_blank" rel="noopener noreferrer">打开原始对象</a></dialog>
<script id="case-data" type="application/json">__CASE_DATA__</script>
<script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('case-data').textContent),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>`<div class="text">${esc(v)}</div>`,json=v=>`<pre>${esc(JSON.stringify(v,null,2))}</pre>`;
const safe=v=>{try{const u=new URL(v);return ['https:','http:','file:'].includes(u.protocol)?u.href:'';}catch{return '';}};
const link=(u,t)=>safe(u)?`<a href="${esc(safe(u))}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>`:esc(t||u);
const labels={candidate:'题目已交付',source_check_failed:'原图构造 / 验收失败',failed:'技术失败',pending:'尚未出题',insufficient:'未形成合格题目',needs_source_synthesis:'待构造原图',generated:'作答已生成',reviewed:'评审完成',pass:'通过',partial:'部分通过',fail:'失败',inconclusive:'无法判定',invalid_criterion:'判据不适用',attached:'已送入模型上下文',not_attached_budget:'因预算未送入模型',unavailable:'未能附图',passed:'验收通过',not_run:'尚未验收'};
const label=s=>labels[s]||s||'尚未执行',badge=(s,prefix='')=>`<span class="badge ${['pass','fail','partial','inconclusive'].includes(s)?s:''}">${esc(prefix+label(s))}</span>`;
const missing=s=>`<div class="missing">${esc(s)}</div>`;
const picture=(key,cls='picture')=>{const m=D.media[key];return !m?missing('没有保存实际图片'):m.error?missing('图片读取失败：'+m.error):`<img loading="lazy" class="${cls}" width="${m.width}" height="${m.height}" src="${m.src}" data-image="${esc(key)}" alt="图片 ${esc(key.slice(0,12))}">`;};
const details=(title,content)=>`<details><summary>${esc(title)}</summary>${content}</details>`;
function gallery(items){return '<div class="gallery">'+items.map(i=>`<figure class="${i.selected?'selected':''}">${picture(i.image)}<figcaption>${esc(i.caption||'')}${i.selected?' · 已选为种子图':''}${i.status?'<br>'+esc(label(i.status)):''}${i.error?'<br>'+esc(i.error):''}</figcaption></figure>`).join('')+'</div>';}
function request(v,title){if(!v?.available)return details(title,missing(v?.note||'没有已保存的调用输入'));let h='';for(const m of v.messages||[]){h+=`<h4>${esc(m.role)}</h4>`;for(const p of m.parts)h+=p.image?picture(p.image):text(p.text)+(p.record?json(p.record):'');}return details(title,`<div class="actual-input">${h}</div>`+details('请求参数与记录位置',json({parameters:v.parameters,source:v.source})));}
function materials(c){let h=gallery(c.positives.map(p=>({...p,caption:'作者正例图 '+p.number})))||'';if(!c.positives.length)h=missing('本次冻结输入没有正例图');for(const m of c.materials){if(m.kind==='concept')h+=`<h4>概念说明</h4>${text(m.definition||'未提供概念说明')}`;else if(m.kind==='document')h+=`<p>${esc(m.document_id)} · ${link(m.document?.url,m.document?.title||m.document?.url)}</p>`;else if(m.kind==='text')h+=text(m.text||m.content||'');}return details('出题材料 · 概念资料、依据文档与正例图（'+c.positives.length+'张）',h+details('完整材料引用',json(c.materials)))+request(c.author_input,'出题者的实际完整输入 · 历史请求');}
function nativeEvent(e){let h=`<b>${esc(e.type)}</b>`;if(e.type==='webSearch'){h+=text(e.query||'')+text(JSON.stringify(e.action||{}));for(const r of e.results||[]){h+=`<div class="point">${link(r.url,r.title||r.url)}${text(r.snippet||'')}`;if(r.thumbnail_url&&/^https?:/.test(safe(r.thumbnail_url)))h+=`<button data-remote="${esc(safe(r.thumbnail_url))}">加载网页缩略图（联网；非附图回执）</button>`;h+='</div>';}}else h+=json(e);return `<div class="stage">${h}</div>`;}
function process(c){let h='<h3>检索与原图构造</h3>';const ops=c.process.operations||[];if(!ops.some(o=>o.method==='search_vectors'))h+=missing('本题没有保存的场景图检索调用；正例图不属于检索结果。');for(const o of ops){h+=`<section class="stage"><h4>算子调用 ${o.index} · ${esc(o.method)}</h4>${json(o.arguments)}`;if(o.images.length)h+=gallery(o.images.map(i=>({...i,caption:`候选 ${i.rank??''}${i.distance!=null?' · 距离 '+Number(i.distance).toFixed(4):''} · ${i.image_id}`})));else h+=text(o.method==='search_vectors'?'本次没有可展示的检索图片。':'本次调用未返回图片。');h+=details('原生返回值',json(o.result))+'</section>';}
if(c.process.native.length)h+=details('原生网络检索与其他已记录工具（'+c.process.native.length+'项）',c.process.native.map(nativeEvent).join(''));if(c.process.note)h+=text('过程日志说明：'+c.process.note);
const q=c.question;if(q){h+='<div class="columns"><section><h4>选中的种子图</h4>'+picture(c.seed)+'</section><section><h4>原图构造指令</h4>'+text(q.source_image_edit||'直接使用选中的种子图，无需合成。');h+='<h4>构造产物</h4>';h+=c.process.artifacts.length?gallery(c.process.artifacts.map(a=>({...a,caption:a.name+(a.name===q.source_artifact?' · 已绑定为本题原图':''),selected:a.name===q.source_artifact}))):missing(q.source_image_edit?'没有保存实际构造产物；不能把种子图当作合成成功。':'未进行原图合成。');h+='</section></div>';
const observations=new Map((q.source_image_check?.observations||[]).map(o=>[o.check,o]));h+=`<h4>原图验收 · ${esc(label(q.source_image_check?.status))}</h4>${text(q.source_image_check?.reason||'')}<table><thead><tr><th>条件</th><th>作者检查</th><th>可见依据</th></tr></thead><tbody>`;(q.source_image_checks||[]).forEach((check,i)=>{const o=observations.get(i+1);h+=`<tr><td>${i+1}. ${esc(check)}</td><td>${o?(o.passed?'通过':'未通过'):'尚未检查'}</td><td class="text">${esc(o?.evidence||'')}</td></tr>`;});h+='</tbody></table>';}if(c.source_diagnostic)h+=details('已保存但未通过验收的原图 · 仅供诊断',picture(c.source_diagnostic));return h;}
function review(c){const r=c.review;let h='<h3>评审结果</h3>';if(!r)return h+missing(c.review_reason||c.generation_reason||'本题未产生有效评审，不计零分。');h+=`<div class="badges">${badge(r.verdict)}<span class="score">${r.score==null||r.score<0?'无法评分':esc(r.score)+' / 10'}</span></div><h4>总体理由</h4>${text(r.reason)}<h4>评审依据</h4>${text(r.basis)}`;for(const p of r.point_results||[]){const t=c.question?.test_points?.[p.index-1];h+=`<section class="point"><h4>考点 ${esc(p.index)} · ${esc(t?.point||'')}</h4>${badge(p.verdict)}<h4>图像证据</h4>${text(p.evidence)}<h4>判断理由</h4>${text(p.reason)}</section>`;}return h+details('概念分类与完整评审',json({category:c.case_category,...r}))+request(c.review_input,'评审者的实际完整输入 · 原图与作答图');}
function card(c){const q=c.question;let h=`<article class="card" data-concept="${esc(c.concept)}"><h2>${c.rank}. ${esc(c.concept)}</h2><p class="muted">${esc(c.taxonomy.join(' / ')||'未提供分类路径')}</p><div class="badges">${badge(c.status,'出题：')}${badge(c.generation_status,'作答：')}${badge(c.review_status,'评审：')}</div>`;if(c.reason)h+=`<p class="text error">${esc(c.reason)}</p>`;h+='<h3>正式题目与考点</h3>';h+=q?`<div class="instruction text" data-field="instruction">${esc(q.instruction)}</div>`:missing('未交付题目；保留概念与失败记录。');for(const [i,p] of (q?.test_points||[]).entries())h+=`<section class="point"><h4>${i+1}. ${esc(p.point)}</h4><p class="muted">依据</p>${text(p.basis)}<p class="muted">正确性判据</p>${text(p.criterion)}</section>`;h+=materials(c)+process(c);
h+=`<h3>最终原图与作答对照</h3><div class="columns"><section data-field="final-source"><h4>最终原图 · ${esc(c.source_kind)}</h4>${picture(c.final_image)}${c.final_image&&c.final_image===c.seed?'<p class="muted">原图直接沿用上面的种子图，这里完整展示实际作答输入。</p>':''}</section><section data-field="answer"><h4>模型作答图</h4>${picture(c.answer)}${text(c.generation_reason)}</section></div>`;const sent=c.generation_input;h+=details('作答者的实际输入 · 按历史调用记录',sent.available?text(sent.request.prompt||'')+(sent.image?picture(sent.image):missing(sent.note))+details('实际请求参数',json(sent.request)):missing(sent.note));h+=review(c)+details('调用与执行记录',json({author:c.author_call,generation:c.generation_call,process_log:c.process.source}));return h+'</article>';}
let page=0,filtered=D.cases;
const technical=c=>!['candidate','insufficient'].includes(c.status)||(c.generation_status&&c.generation_status!=='generated')||(c.review_status&&c.review_status!=='reviewed');
function filter(){const q=$('search').value.toLocaleLowerCase(),s=$('status').value;filtered=D.cases.filter(c=>(c.concept+JSON.stringify(c.question||{})).toLocaleLowerCase().includes(q)&&(!s||s==='technical'&&technical(c)||s==='reviewed'&&!!c.review||s==='retrieved'&&c.process.operations.some(o=>o.method==='search_vectors')||c.review?.verdict===s));page=0;render();}
function render(){const size=Number($('size').value),total=Math.max(1,Math.ceil(filtered.length/size));page=Math.max(0,Math.min(page,total-1));$('jump').value=page+1;$('jump').max=total;$('cases').innerHTML=filtered.slice(page*size,(page+1)*size).map(card).join('')||'<p class="empty">没有匹配的概念</p>';const t=`${filtered.length} 个概念 · ${page+1} / ${total} 页`;$('count').textContent=t;$('bottom-count').textContent=t;for(const id of ['prev','bottom-prev'])$(id).disabled=page===0;for(const id of ['next','bottom-next'])$(id).disabled=page===total-1;window.scrollTo(0,0);}
for(const id of ['search','status'])$(id).addEventListener(id==='search'?'input':'change',filter);
for(const id of ['prev','bottom-prev'])$(id).onclick=()=>{page--;render();};for(const id of ['next','bottom-next'])$(id).onclick=()=>{page++;render();};$('size').onchange=()=>{page=0;render();};$('jump').onchange=()=>{page=Number($('jump').value)-1;render();};$('reset').onclick=()=>{$('search').value='';$('status').value='';filter();};
for(const c of D.cases){const option=document.createElement('option');option.value=c.concept;option.textContent=c.rank+'. '+c.concept;$('concept').appendChild(option);}$('concept').onchange=()=>{const i=D.cases.findIndex(c=>c.concept===$('concept').value);if(i<0)return;$('search').value='';$('status').value='';filtered=D.cases;page=Math.floor(i/Number($('size').value));render();};
$('summary').textContent=`${D.meta.run} · ${D.meta.concepts} 个概念 · ${D.meta.complete?'整轮完成':'整轮未完成'}（${D.meta.status}） · 快照 ${D.meta.updated_at}`;
$('stats').innerHTML=badge('已交付 '+(D.meta.author.candidate||0))+' '+badge('已生成作答 '+(D.meta.generations.generated||0))+' '+badge('通过 '+(D.meta.reviews.pass||0))+' '+badge('部分通过 '+(D.meta.reviews.partial||0))+' '+badge('作答失败 '+(D.meta.reviews.fail||0))+' '+badge('有效评分 '+D.meta.scored+' 题 / 均分 '+(D.meta.mean_score==null?'—':D.meta.mean_score.toFixed(2)))+' '+badge('技术未完成 '+D.cases.filter(technical).length)+' '+badge('场景检索 '+D.meta.scene_search_calls+' 次');
$('metadata').textContent=JSON.stringify(D.meta,null,2);
$('cases').onclick=e=>{const key=e.target.dataset.image;if(key){const m=D.media[key];$('large-image').src=m.src;$('image-note').textContent=`预览 ${m.width}×${m.height}\nURI：${m.uri}\nSHA256：${m.sha256}`;$('original-link').href=safe(m.uri);$('image-dialog').showModal();}const url=e.target.dataset.remote;if(url){const img=document.createElement('img');img.className='remote-preview';img.src=url;img.referrerPolicy='no-referrer';img.alt='网页记录的缩略图（非模型附图回执）';img.onerror=()=>{img.replaceWith(document.createTextNode('缩略图无法加载；来源 URL 仍保留。'));};e.target.replaceWith(img);}};
$('close-image').onclick=()=>$('image-dialog').close();render();
})();
</script></body></html>
