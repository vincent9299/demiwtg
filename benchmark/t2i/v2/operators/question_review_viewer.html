<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>T2I V2 · 题目 Review</title><style>
body{font:15px/1.7 system-ui;color:#213047;background:#f4f7fb;margin:0}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:24px}h2{font-size:21px}h3{font-size:18px;margin-top:26px}.controls{position:sticky;top:0;background:#f4f7fb;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;padding:7px;border:1px solid #bbcadb;border-radius:5px;background:white}.card{background:white;padding:22px;border:1px solid #d8e2ec;border-radius:10px;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dce5ed;padding:12px;text-align:left;vertical-align:top}.text,pre{white-space:pre-wrap;overflow-wrap:anywhere}pre{font:13px/1.6 monospace}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.badge{display:inline-block;background:#e6edf8;padding:4px 10px;border-radius:4px;margin:0 8px 8px 0}.images{display:flex;gap:12px;flex-wrap:wrap}.images img{max-width:240px}.muted{color:#69788b}summary{cursor:pointer}@media(max-width:900px){.columns{grid-template-columns:1fr}}
</style><main><h1>T2I V2 · 题目 Review 与固定检查清单</h1><p>审核只使用题目与依据材料。ready 表示可交付；hold 表示业务暂缓；pending、failed 等技术状态单独保留。修改题面后需要重新作答。</p><div id="stats"></div><div class="controls"><input id="search" placeholder="搜索概念或题面"><select id="status"><option value="">全部状态</option><option>ready</option><option>hold</option><option>pending</option><option>failed</option><option>invalid_materials</option></select><button id="prev">上一题</button><span id="page"></span><button id="next">下一题</button></div><div id="case"></div><details><summary>固定来源与运行状态</summary><pre id="metadata"></pre></details></main><script id="review-data" type="application/json">__REVIEW_DATA__</script><script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('review-data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=x=>`<div class="text">${esc(x)}</div>`,json=x=>`<pre>${esc(JSON.stringify(x,null,2))}</pre>`;let page=0;
$('stats').innerHTML=`<div class="text muted">结果版本：${esc((D.meta.prompt_versions||[]).join('、')||'尚无调用记录')}<br>运行：${esc(D.meta.run)}<br>查看刷新时间：${esc(D.meta.updated_at)}</div><span class="badge">已记录 ${D.meta.recorded} / ${D.meta.expected}</span><span class="badge">${esc(D.meta.phase)}</span>`+Object.entries(D.meta.counts).map(([k,v])=>`<span class="badge">${esc(k)}：${v}</span>`).join('');if(D.meta.page_size)$('stats').innerHTML+=`<p class="muted">明细第 ${D.meta.page} / ${D.meta.pages} 批，本批 ${D.meta.shown} 题；上方统计为全批进度。切换批次或刷新请使用 Notebook 的明细控件。</p>`;$('metadata').textContent=JSON.stringify(D.meta,null,2);
function render(){const query=$('search').value.trim().toLowerCase(),status=$('status').value,rows=D.cases.filter(r=>(!status||r.review_status===status)&&(!query||(r.concept+r.original_instruction+r.instruction).toLowerCase().includes(query)));page=Math.min(page,Math.max(0,rows.length-1));$('page').textContent=rows.length?`${page+1} / ${rows.length}`:'0 / 0';$('prev').disabled=page===0;$('next').disabled=page>=rows.length-1;const r=rows[page];if(!r){$('case').innerHTML='<div class="card">'+(D.meta.phase==='not_submitted'?'尚未提交题目 Review；未调用模型。':'没有符合筛选条件的已保存结果。')+'</div>';return;}const res=r.result||{},req=JSON.parse(r.requirements_json||'[]'),points=p=>(p||[]).map((x,i)=>`<h4>${i+1}. ${esc(x.point)}</h4>${text(x.basis)}${text(x.criterion)}`).join('');
$('case').innerHTML=`<article class="card"><h2>${esc(r.concept)}</h2><span class="badge">${esc(r.review_status)}</span><span class="badge">${r.requires_new_answer===true?'需要重新作答':r.requires_new_answer===false?'题面未改，可复用原作答后重评':'尚未定稿'}</span>${text(r.review_reason)}<div class="columns"><section><h3>原题面</h3>${text(r.original_instruction)}<details><summary>原考点、依据与判据</summary>${points(JSON.parse(r.original_test_points_json))}</details></section><section><h3>定稿题面</h3>${text(res.question?.instruction||'暂未交付定稿')}<details><summary>定稿考点、依据与判据</summary>${points(res.question?.test_points)}</details></section></div><h3>修改说明与未决问题</h3>${json({changes:res.changes||[],issues:res.issues||[]})}<h3>固定检查清单</h3><table><thead><tr><th>要求</th><th>维度／核心性</th><th>依据</th><th>判据与条件</th></tr></thead><tbody>${req.map(x=>`<tr><td>${esc(x.id)} ${text(x.requirement)}</td><td>${x.dimension==='task_correctness'?'任务正确性 · '+(x.is_core?'核心':'非核心'):'其他题面遵循'}</td><td>${text(x.basis)}</td><td>${text(x.criterion)}${x.applicability?text('触发条件：'+x.applicability):''}</td></tr>`).join('')}</tbody></table><h3>实际发给 Review 模型的完整输入</h3>${r.actual_parameters?json(r.actual_parameters):''}${r.actual_request?`<details><summary>展开完整实际文本</summary>${text(r.actual_request)}</details>`:text('没有已保存的请求，不按当前模板补写。')}<p>初始请求随附图片：${r.actual_images.length} 张</p><div class="images">${r.actual_images.map(x=>`<figure><figcaption>Image ${x.number}</figcaption>${x.error?text(x.error):`<img src="${D.media[x.media]}" alt="实际正例图 ${x.number}">`}<details><summary>原图引用</summary>${json(x.reference)}</details></figure>`).join('')}</div><h3>Demiflow 算子回调：实际参数与返回材料</h3>${r.operator_observations.length?json(r.operator_observations):text("没有已记录的算子回调。")}<h3>Codex 原生工具读取记录</h3>${r.native_tool_events.length?json(r.native_tool_events):text('没有已记录的原生读取事件；不能据此认定已查看所有材料。')}<details><summary>本题全部作者正例图引用（不表示已查看）</summary>${json(r.available_references)}</details><details><summary>原始输出、请求引用与题目版本</summary>${json({result:res,request_ref:r.request_ref,response_ref:r.response_ref,source_task_id:r.source_task_id,task_id:r.task_id,question_revision:r.question_revision})}</details></article>`;}
for(const id of ['search','status'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};render();})();
</script></html>
