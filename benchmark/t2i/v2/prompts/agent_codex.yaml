    response_schema:
      type: object
      required:
      - result
      additionalProperties: false
      properties:
        result:
          type: object
          required:
          - question
          additionalProperties: false
          properties:
            reason:
              type: string
              minLength: 1
            question:
              required:
              - instruction
              - test_points
              additionalProperties: false
              properties:
                instruction:
                  type: string
                  minLength: 1
                test_points:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - point
                    - basis
                    - criterion
                    additionalProperties: false
                    properties:
                      point:
