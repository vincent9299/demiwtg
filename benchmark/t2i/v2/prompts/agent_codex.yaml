schema_version: demiflow_agent_v2
runtime: codex
model:
  name: gpt-6-astra
operators:
  read_documents:
    fn: demiflow.collect.reading:read_documents
resources: document_resources
budgets:
  max_requests: 300
  max_context_chars: 180000
  max_operator_calls: 8
  max_material_chars: 12000
  max_observation_chars: 60000
  max_document_bytes: 8388608
  max_resources: 64
  document_concurrency: 2
  timeout_s: 30
options:
  timeout_s: 1800
  codex_agent:
    max_message_bytes: null
    bin: /root/.vscode-server-codex/.vscode-server/extensions/openai.chatgpt-26.5917.62051/bin/linux-x86_64/codex
    reasoning_effort: xhigh
    shell_tool: false
    view_image: false
    web_search: live
    max_events: 32768
    output_schema:
      type: object
      required:
      - result
      additionalProperties: false
      properties:
        result:
          anyOf:
          - type: object
            required:
            - question
            additionalProperties: false
            properties:
              question:
                required:
                - instruction
                - test_points
                additionalProperties: false
                properties:
                  instruction:
                    type: string
                    minLength: 1
                  test_points:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required:
                      - point
                      - basis
                      - criterion
                      additionalProperties: false
                      properties:
                        point:
                          type: string
                          minLength: 1
                        basis:
                          type: string
                          minLength: 1
                        criterion:
                          type: string
                          minLength: 1
                type: object
          - type: object
            required:
            - question
            - reason
            additionalProperties: false
            properties:
              question:
                type: 'null'
              reason:
                type: string
                minLength: 1
tasks:
  design_question:
    version: t2i-v2-independent-materials-17
    schema_retries: 0
    template: |
      你是 T2I benchmark 的题目设计者。根据给定概念、依据材料、正例图及你掌握的可靠知识，设计一道围绕概念核心内容、具有值得考察的区分潜力、任务明确、正确性可检查的图像生成题。质量优先；如果无法形成符合下述标准的题目，就不出题。

      可以在必要时使用当前可用的检索工具核实关键事实，再完成出题判断。最终只返回题目或不出题的原因，不先输出知识摘要、发现清单或设计过程。

      **一、输入与作答条件**

      concept 是给定概念；taxonomy 是该概念的完整分类路径列表，用于理解所属领域与义项，不是题目质量标签或事实证明。多条路径都应保留考虑，不能只按第一条擅自选择义项；名称与分类冲突或仍有关键歧义时，先核实，无法明确对象则不出题。taxonomy 为空只表示未提供分类，不要编造路径。

      输入可能包含“概念审定资料”，提供本次概念的说明及可按需查阅的材料入口。请根据下文的质量标准独立选择考点和任务。

      **概念说明**明确本次考察的对象、范围和必要限定。此时 concept 使用审定后的规范名称，来源中的原名用于材料关联，不表示可以切换义项。请据此理解概念；为具体任务选择某种状态或实例时，应保留它与原概念的关系。

      概念说明中提到的具体特征、实例或任务建议仅供理解，不限定考点或出题方向；请在保留概念身份和必要范围的前提下，按下文质量标准独立设计任务。

      **依据材料**提供此前核对概念身份和部分事实时使用的来源链接及固定文档入口，原文按需获取，不在初始输入中展开。这些材料仅覆盖此前审定涉及的部分内容，不是该概念的完整资料或知识清单，不限定出题范围。请根据下文质量标准独立选择考点，可用 read_documents 读取本题文档，也可联网检索其他可靠来源。调用文档工具时使用工具声明的 request 参数和环境提供的完整 document_ref；材料编号及原文块编号用于定位，不替代文档引用。

      区分审定结论、原文实际支持的内容和任务设计中的推断；提供路径、链接或引用编号不表示你已读过原文。发现影响题目成立的实质冲突且无法解决时，应说明原因并不出题，不能暗中换对象或把另一对象的特征补进来。

      依据材料供出题和核验使用。使用原文支撑考点时，在 basis 中引用实际提供的材料编号及来源，说明支持的事实与适用条件；审定原文使用“审定材料 E…”，独立文章正文使用“文章材料 A…”。

      每次根据一个概念最多出一道题，不接收题数参数；无法形成合格题目时返回空题并说明原因。依据材料和正例图按实际提供的内容使用，也可以充分利用你掌握的可靠知识；材料缺失本身不是拒绝出题的理由。

      依据材料用于帮助你理解概念、发现考点和核对事实；使用时仍须检查其可靠性和适用条件，不把它当作绝对正确的标准答案。

      **正例图：** positive_examples 列出按当前概念定义审核通过的图片，image_number 对应后面实际图片的顺序。图片用于帮助理解概念、核对可见特征和检查可观察性。审核通过表示这个实例与概念匹配，不代表其颜色、视角、背景、个别结构或状态都是所有合法实例的必要条件；涉及普遍规则仍须结合定义和可靠资料判断。

      **禁止照着正例图出题。** 不得把某张正例图当作目标答案，先描述图中已有画面，再反推题面；不得为了复现该图而指定构图、背景、姿态、物体组合或其他偶然细节。应先依据概念的核心内容选择有价值的考点，再设计独立成立的任务及必要条件。图中细节只有在有独立可靠依据、属于所选核心考点且为当前任务所必需时，才可成为要求；换成同一适用条件下的其他合法正例，考点与判据仍应成立。

      basis 引用这些图时使用“正例图 N”，说明实际可见的支持范围；只描述实际提供且看过的图片。

      作答模型只接收题面。题面应独立明确对象、任务和必要条件，不使用“图中的对象”“按照材料二”等必须查看作者资料才能理解任务的指代。独立完整不意味着把作答所需的知识全部写进题面；需要考察的概念内容，应留给作答模型根据自身知识确定。

      例如，“生成一张莜面栲栳栳的食物特写”已经明确了对象。模型不了解它的形态，属于缺少相关知识；而“生成正例图中那种食物的特写”依赖作答模型未获得的图片，属于任务输入不完整。

      **二、五条共同的质量门槛**

      以下五条需要同时满足，用于选择考点和检查最终题目。概念被交给你，不代表它一定适合出题；即使已经通过前置筛选，也不能降低最终题目的标准。可用材料或检索结果可以帮助发现方向、核实事实，但不能代替对题目价值的判断。

      1. **直接考察给定概念的核心内容。** 核心内容是对理解该概念是什么、如何构成、具有怎样的属性，或在相关条件下如何表现和发挥作用具有实质意义的内容。考点与概念的联系应直接，不能借相关内容或放宽对象来成立。例如，挂图中展示的地图知识不因此成为“挂图”的核心；要求思源黑体，却允许任何普通黑体通过，也丢掉了给定对象的重要限定。多个概念可以共享知识，不要求特征独有，但不能舍去给定对象中有意义的限定，只考上位类别。

      2. **核心内容具有具体、值得测的区分潜力。** 设想作答模型已经知道对象的大致类别，也能画出像样的画面：这道题还会在哪项重要核心内容上区分正确与错误？应能指出一种看起来符合题意、却在核心内容上有实质错误的答案，并说明这种差别为什么值得比较模型。例如，部件齐全但不能形成正确的作用关系，可能构成有价值的错误边界；仅能排除画成完全不同的东西，通常不够。不能只因想出了任意错误，就认定题目值得测。

      单独一项关键特征也可以有价值，不要求复杂推理或多个知识点。这里判断的是区分潜力，实际区分度需要后续跨模型作答验证；不能无依据地声称模型普遍会错或一定能拉开差距，也不能由假设的错误断言模型内部缺少某项知识。

      3. **区分主要来自核心内容及其应用。** 去掉无关的排版、数量、背景、装饰和画面精细度要求后，仍应留下值得比较的核心正确与错误。不能用外围生成负担弥补考点过薄。颜色、文字、计数、曲线或细小结构本身属于核心知识时可以考，应根据它们在当前任务中的作用判断，不能按表现形式一概排除。

      4. **正确性边界可靠，能够公平判断。** 核心要求应有可靠事实依据，并在题目要求的图像中可观察。既要明确什么违反核心内容，也要容纳合法变化；不能把常见做法写成必要条件，或把某个实例、版本的特点推广为普遍规则。影响答案的版本、状态和条件应明确，关键事实存疑时先核实或调整考点，仍不能解决就不出题。

      5. **所选方向自然、有代表性，保住考察对象。** 可以选取子类型、代表作品或特定条件，但它们应与给定概念的核心有实质联系。例如，数学分析中的黎曼和可以围绕定积分的构造展开；具体动物博物馆的身份不明时，退回任意展柜加标本并没有解决对象问题。不能不断换义项、借其他概念或追加限制，直到勉强找到一个能画的方向。

      五条不能互相补偿：容易判分不能弥补考点过薄，知识有趣不能弥补事实或判据不稳。可以利用可靠知识、材料和必要检索完善候选；最终仍只能说明“勉强能出”“也许有价值”时，返回 question: null，不为每个概念凑一道题，也不需要穷尽所有可能方向才允许不出题。

      **三、围绕概念的核心内容选择考点**

      题目的主要要求应落在这些内容的正确呈现与应用上。鲜明的视觉特征、基本结构和常见知识都可以成为有效考点，不要求知识冷门、仅属于某一个概念，也不要求每道题包含复杂推理。

      1. 明确概念与任务范围

      优先选择范围明确、在适用条件下具有可靠核心内容，并能通过图像判断的概念。概念可以指一类对象，不要求对应唯一实例。例如，“普通手动剪刀”“莜面栲栳栳”都包含不同实例，但仍有可以考察的结构、功能或形态知识。需要明确的是概念及其适用范围，不必指定现实中的某一把剪刀或某一笼食物。

      对于“建筑”“动物”“器物”等宽泛类别，应先判断该类别层面是否存在值得考察、依据可靠且能够观察的核心内容，不默认通过增加限定就一定能形成有效题目。不能仅靠增加任意颜色、数量、位置或背景细节，使题目显得具体。

      需要选择子类型，或限定地域、时期、版本等适用范围时，应围绕给定概念展开，并在题面中明确实际考察对象和条件。不能只给出宽泛名称，却暗自采用某个具体类型的要求，也不能把子类型的特点推广为整个类别的要求。例如，如果考察莜面栲栳栳的特点，题面应明确“莜面栲栳栳”，不能仅用“莜面”指代。

      宽泛与抽象是不同问题。抽象概念若具有明确、依据可靠且可视觉呈现的结构、关系或规则，可以考察。例如，“生成一个具有轴对称性、但不具有中心对称性的平面图形”，直接考察两个概念之间的区别，正确性可以通过图形判断。主要依赖自由诠释、情绪联想或作者指定象征画面的主题，原则上不纳入。例如，“画一幅表现自由的图”缺少明确的正确性边界；强行规定飞鸟、天空或打开的牢笼，也只是指定了一种象征画面，不能据此认定其他表达不正确。

      无需追求唯一实例、唯一画法或最多的知识点。找不到合适考点时，可以不出题，不以附加执行要求弥补概念内容的不足。

      2. 根据概念的核心内容，选择适用的考察方面

      以下六个方面仅用于帮助发现和组织考点，不代表每个概念都具有值得考察的对应内容。选择任何考点，都应先满足“属于概念核心内容”的前提：它应对理解该概念是什么、如何构成，或在相关条件下如何表现和发挥作用具有实质意义，并有可靠依据、能够通过图像判断。

      不要为了覆盖某个方面，刻意寻找与概念只有间接联系的事实，或额外构造缺少考察意义的条件。某项内容与概念有关，或能够被画出来，并不足以说明它适合作为核心考点。

      只选择实际适合该概念及当前任务的方面，可以只涉及一个，也可以自然结合多个；允许交叉，不要求逐项覆盖。找不到合适内容的方面直接略过，不以覆盖数量衡量题目质量。

      - **特征与结构**：身份、外形、部件、纹理及内部或外部结构，以及局部与整体的组织关系。可以考察细粒度概念之间的视觉区别，也可以考察部件如何构成正确整体。例如，常见链条传动自行车的相关部件需要形成正确的传动结构，仅出现脚踏、链条和车轮并不足够。注意区分概念特点与某个实例偶然具有的装饰或外观细节。

      - **属性与状态**：概念在特定阶段、环境、状态或版本下应呈现的表现。例如，完全撑开的雨伞，其伞面和支撑结构应与展开状态一致。对于成分、浓度、精确数值等不能从普通外观直接判断的属性，若要纳入考察，应由题目明确指定可表达、可判断的呈现方式，不能仅凭外观猜测。

      - **功能与机制**：对象的用途、工作结果，以及实现功能所需要的部件、连接或作用关系。例如，剪刀与纸并排出现，不足以表现剪刀正在剪纸。需要区分画面呈现了工作结果、结构满足了必要条件，以及展示了内部机制；不能仅凭结果或外观相似，就认定机制正确。

      - **过程与变化**：概念在明确条件下发生的变化，以及不同阶段或时刻应具有的表现。应说明需要呈现的阶段、状态及变化成立的条件，不把可能变化写成必然。例如，一张完全撑开的雨伞图片可以展示展开后的状态，但不能单独证明完整的展开过程；若考察阶段差异，应设计能够展示这些差异的任务。

      - **关系与组织**：对象或部件之间的角色、连接、接触、支撑、方向、位置、归属及组织关系。对象分别画对，不代表关系正确。例如，在指定的骑行动作中，骑手与自行车需要形成相应的姿态、接触与支撑关系。关系要求应绑定到相关对象及其适用范围，不能扩大到无关背景。

      - **规则与约定**：概念在特定制度、传统、符号系统或表示方法下遵循的规则。应保留地域、时期、版本、例外及合法变体。例如，在采用菱形表示判断节点的流程图体系中，需要检查相应节点是否正确承担判断作用，不能由一个无关的装饰性菱形代替。若考察对该体系的了解，可以指定体系和需要表达的流程，把符号与功能的对应留给模型确定。

      这些内容既可以由依据材料提供，也可以来自材料之外的可靠知识。视觉知识同样属于概念知识，不应将“视觉特征”和“知识”视为互斥类别。

      3. 选择能与核心内容结合的条件

      可以直接考察概念的核心内容，也可以通过相关状态、动作、场景或对象关系，考察这些内容在具体条件下如何体现与应用。

      用于构成考点的条件应有明确的概念依据。它可以帮助呈现某项特点，决定某条知识是否适用，或要求多个相关特点共同约束结构、作用关系及可见结果。不预设正常状态或特殊状态更好，也不以条件多少衡量题目价值。

      例如，假设正例图展示了一把张开放在桌面上的剪刀，依据材料介绍了它的结构和用途，可以设计：

      > 请生成一张普通手动剪刀正在剪纸的近景图：纸张已从边缘剪开一段，尚未剪完，清楚呈现剪刀与纸张的作用部位及已经剪开的部分。

      这道题不仅涉及剪刀结构，还需要刀刃与纸张形成合理的作用关系，已经剪开的部分也应与当前剪切位置衔接。这些要求围绕剪刀的结构和功能共同形成考察，不是无关细节的堆叠。

      依据材料可以支持设计任务所需的基本知识，而不必包含该任务的完整画面。“材料没有直接给出答案”不是选题目标；核心结构和关系是否值得考察、能否公平判断，仍应按前述质量门槛确定。

      一道题可以只深入考察一项核心内容，也可以结合多个相关内容。无需强造多跳推理。把同一事实拆成几个检查项，不等于增加了知识点；多个对象分别应用一条事实，也不能仅凭数量就称为推理。

      4. 不要在题面中直接给出核心考点的答案

      题面应交代要生成什么、处于什么条件下，以及必须展示哪些方面。对于希望模型依据概念知识确定的关键表现，避免在题面中逐项展开完整答案。

      例如，可以要求：

      > 请生成一张莜面栲栳栳的食物特写，展示一笼刚蒸好的成品，清楚呈现成品的形态与可见结构。

      如果主要考察成品形态，就应将具体形态和结构留给模型根据概念知识确定。若题面已把预期形状、结构和排列特点全部写明，任务便容易转向逐项执行描述。

      这不意味着禁止明确描述特征。特殊设定、指定状态、非典型要求和必要展示条件应写清楚；不能为了保留隐含考点而省略任务信息。隐含要求必须在指定条件下有可靠依据，不能来自作者偏好或某个实例的偶然细节。

      **四、材料、已有知识与检索依据怎样使用**

      1. 如实说明依据

      考点可以依据题面明确给出的设定、依据材料、正例图中实际可见的内容、你掌握的可靠概念知识，以及实际检索核实的来源。不同考点可以有不同依据，同一考点也可以得到多种依据的支持。

      允许引入材料之外的可靠知识，但需要明确具体事实及适用条件。对于声称由材料支持的要求，应能说明材料提供了什么、如何支持该要求。不能用自身知识替换材料内容，再声称结论来自材料；需要额外知识才能成立的结论，应如实说明额外依据。

      **按需查阅资料：** 围绕拟选考点，按需读取所附本地文档或联网检索，核实关键事实、适用条件和判据。无需先读完本地材料，也不必先发现材料缺口才使用网络检索。只把实际读到的内容作为已读依据；未读范围、读取失败和预算不足都不表示事实不存在。basis 写明具体来源、支持的事实，引用快照时注明文档及原文块编号。关键依据仍不足时，调整考点或返回 question:null 与具体原因。

      对你有把握的稳定知识，可以直接用于出题，不要求每道题都检索或配齐材料。对对象身份、具体形制、规则版本、适用条件或相互冲突的说法没有把握，且这些事实会影响题目是否成立、答案是否正确时，应在工具可用的情况下主动检索核验。优先查看直接相关的官方资料、原始文献或其他可靠来源，实际阅读支持该事实的内容；不能把搜索摘要、来源名称或模型印象当成已经验证。

      检索用于解决具体疑问，不要求搜集大量资料，也不靠不断扩大检索范围挽救薄弱考点。工具不可用、检索失败或资料仍不能解决关键疑问时，不得声称已经核实；可改用有可靠依据且仍满足五条门槛的考点，否则返回空题。没有材料或没有工具本身不构成拒绝理由，决定因素是能否形成可靠且值得测的题目。

      使用检索来源支撑考点时，在 basis 中简要说明具体事实、必要条件，并附实际查阅的来源名称和可追溯链接，不编造材料编号。检索资料用于作者核验；题面仍须独立完整，不能要求作答模型查看未提供的网页或图片。

      2. 区分图像证据、文字信息与推论

      声称图片展示了什么，应以实际可见内容为准。标题、概念标签或模型描述不能替代图像证据。文字可以独立提供知识，但不能因此认定这些知识已经在图片中得到展示。

      单张实例图不自动证明整个类别的一般规律。不要把某个地区、时期、版本或状态下的陈述推广为普遍规则，也不要把关联写成因果、可能写成必然，或把尝试写成已证实有效。

      3. 检查可靠性与适用范围

      材料与作者已有知识都可能出错。应检查概念对应、内容范围及图文一致性，不能默认任何一方绝对正确。

      发现关键冲突或无法确认的事实时，应核实、限定适用范围、调整考点或放弃候选。不能悄悄修正材料后仍声称结论由材料推出，也不能把存疑事实作为确定的正确性标准。

      材料准确也不意味着其中每个细节都是必要要求。应区分当前条件下应具备的特点、允许变化的实例细节，以及尚不能确定的内容。

      4. 从材料中选取有价值的知识

      依据材料和正例图可以帮助发现核心特点、相关知识和可观察的表现。所选考点仍须满足前述质量门槛，不能因为某项细节出现在材料中，就认定它值得考察。

      需要考察进一步应用时，应围绕概念核心内容选择有意义的条件。例如，“剪纸”可以调用剪刀的结构和功能；不能仅为与正例图不同，就增加无关对象、改变背景或强加特殊操作。遵守前述禁止照着正例图出题的要求，独立确定任务与判据。

      **五、在最终的具体任务中检查题目是否成立**

      定稿时，以最终 instruction 确定的对象、任务和必要条件为准，联合检查每项 point、basis 和 criterion。以下三项把五条质量门槛落实到这道具体题目，不能替代或降低门槛；前置筛选通过也不代表新设计的题目自动成立。只输出定稿题目及其依据、判据，不输出检查过程。

      1. **知识可靠：依据能否支持具体判据及其适用条件？**

      basis 应说明支撑考点和判据的具体事实，以及有关的类型、版本、状态或其他适用条件。按前述材料和检索规则核对来源及支持范围；不能把常见表现当成必要条件，也不能把单个实例的特点推广为整个类别的标准。关键事实存疑时核实、限定范围或调整考点，仍不可靠则不出题。

      依据说明为什么该要求成立，判据说明在当前题目中怎样判断图像，两者不能互相替代。不能只写“符合概念特征”“结构正确”，让评审者自行补出正确答案。

      2. **任务一致：考点和判据是否适用于题面确定的任务？**

      题面、考点、依据与判据应指向同一对象、范围和条件。某项概念知识为真，不等于当前图像必须展示它；不能仅因材料提到某个事实就追加为隐藏要求。影响对错的对象限定、状态和任务条件应写入题面，不能留到判据中才补充。

      题面应写清对象、任务和必要条件，把待考的关键表现留给模型依据概念知识确定，不把答案逐项写成绘制指令；也不能为了避免提示答案而删去必要条件。仅增加执行负担、对核心考点和可判断性没有作用的要求应删除。

      3. **图像可判：合理作答能否提供证据，判据能否区分正确、错误和无法确认？**

      criterion 应针对当前任务，写明观察的部位或关系、正确图像应呈现的具体内容，以及看似合理却违反核心要求的实质错误；必要时说明合法变化和无法确认的边界。关系考点应保留关系本身，不能拆成相关元素是否出现；一个 criterion 可以描述紧密相关的多个可观察条件，不必拆成逐元素检查项。单个状态不能自动证明完整过程，工作结果不能自动证明内部机制，也不能用正确文字替代应画出的结构关系。

      检查是否存在合理遵循题面展示要求，却仍无法观察核心考点的画法。如果存在，应在题面补充自然、必要的展示范围、尺度、状态或视角要求，限定到足以判断为止；不固定唯一构图，不要求所有特征同时可见。可采用具有足够身份上下文的局部展示；内部结构或机制可以用合适的自然可见部分、剖面或示意呈现，必要时在题面明确。切开、拆解等操作应与核心内容有实质联系，不能仅为方便检查而加入。

      同时检查是否存在符合题面及适用知识，却被判据误判的合理画法。保留不影响考点的风格、视角、布局、背景及合法实例差异，不以正例图的偶然细节、无依据数值、作者偏好或唯一像素布局作为标准。证据不足不能直接当成知识错误；若符合题面的合理画法普遍无法判定，不能仅在判据中写“无法确认”便视为题目合格，应调整任务或放弃。

      三项必须同时成立，且最终题目仍须满足全部五条质量门槛。发现问题时联合调整题面、考点、依据和判据，并按调整后的具体任务重新核对；无法解决时返回空题。判断针对图像表现，不推断模型内部知识或推理，也不预言某个模型必错或题目必有训练价值。

      **六、输出**

      只输出 JSON。一道题保留完整题面，以及一个或多个紧密相关的考点、依据和判据。basis 和 criterion 用于审核和评判，可以明确写出正确内容；不将它们作为作答指令提供给生成模型。不输出分值、权重、知识空缺分析、难度标签或设计过程。

      - `instruction`：完整、可独立理解的题面。
      - `test_points`：考点列表。每项包含：
        - `point`：简短说明考察哪项概念核心内容，以及必要时在什么条件下应用。
        - `basis`：说明支撑该考点及判据的具体事实和必要适用条件。来自材料时，引用输入已有的材料编号并说明支持内容；来自自身知识时，写明具体知识；来自检索时，说明已核实的事实并附实际查阅的来源名称和链接；共同支持时简短说明。不要只写“依据常识”，不要伪造引用、来源或链接。
        - `criterion`：用简洁、具体的文字说明针对最终题面的可观察正确表现及实质错误，必要时交代合法变化与无法确认的边界。写出用于判断的具体标准，不重复考点名称或只写“正确、合理、符合要求”，不加入题面条件无法支持的隐藏要求。

      材料编号可以出现在依据说明中，不应成为题面理解所必需的指代。

      有合格题目时只返回一道完整题目。选择有代表性的概念核心内容，不为覆盖概念而把多个独立考点堆进一题；一道题可以包含紧密相关的多个考点。找不到同时满足五条门槛的题目时，返回 question: null 和具体 reason。原因可以是核心联系不足、区分潜力太薄、范围不自然，或事实、任务明确性、可观察判据存在未解决的问题；不必等到完全无法绘制才允许不出题。

      输出格式如下，示意文字应替换为实际内容：

      ```json
      {
        "question": {
          "instruction": "完整题面",
          "test_points": [
            {
              "point": "考察的概念核心内容及相关应用",
              "basis": "支持该考点及判据的具体材料内容或可靠知识，以及必要的适用条件",
              "criterion": "针对最终任务，观察什么、正确应怎样呈现、什么构成实质错误；必要时说明合法变化和无法确认的边界"
            }
          ]
        }
      }
      ```

      没有合格题目时输出：

      ```json
      {
        "question": null,
        "reason": "简要说明当前方向未达到哪项质量门槛，以及具体障碍"
      }
      ```

      有题时不输出不足原因。将上述业务 JSON 放入响应的 result 属性。
      以下依次提供本次概念信息、概念资料与依据材料，以及单列的正例图。按实际内容使用，不虚构材料、引用或核验过程。
      {{ payload | json }}
      {{ concept_context }}
      **正例图**
