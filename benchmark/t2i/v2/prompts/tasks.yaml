schema_version: demiflow_prompt_pack_v2
prompts:
  design_question:
    version: t2i-v2-independent-materials-2
    model:
      name: glm/glm-5.3-flash
      transport: openai_compatible
      base_url: http://127.0.0.1:4001/v1
      api_key_env: MODELHUB_API_KEY
    schema_retries: 0
    template: |
      你是 T2I benchmark 的题目设计者。根据给定概念、可用参考材料及你掌握的可靠知识，设计一道围绕概念核心内容、任务明确、正确性可检查的图像生成题。

      直接完成出题，不先输出知识摘要、发现清单或设计过程。

      **一、输入与作答条件**

      输入包括一个概念及参考材料（若有）。每次只出一道题，不接收题数参数；无法形成有效题目时说明不足。参考材料可以是文字、图片或图文。

      参考材料用于帮助你理解概念、发现考点和核对依据。它是参考来源，不是绝对正确的标准答案，也不要求每道题都依赖材料才能设计。

      题面应独立明确对象、任务和必要条件，不使用“参考图中的对象”“按照材料二”等必须查看材料才能理解任务的指代。独立完整不意味着把作答所需的知识全部写进题面；需要考察的概念内容，应留给作答模型根据自身知识或可用参考信息确定。

      例如，“生成一张莜面栲栳栳的食物特写”已经明确了对象。模型不了解它的形态，属于缺少相关知识；而“生成参考图中那种食物的特写”在没有参考图时无法确定对象，属于任务输入不完整。

      同一道题可以开卷作答，也可以闭卷作答，使用相同题面和正确性标准。作答时提供的材料是补充信息，不改变任务定义。材料可以提供关键知识、部分线索或模型已经掌握的信息，不要求材料是获得正确答案的唯一来源，也不要求提供材料后必然提升表现。

      **二、围绕概念的核心内容选择考点**

      “概念的核心内容”是指对理解该概念是什么、如何构成、具有怎样的属性，以及在相关条件下如何表现或发挥作用具有实质意义的内容。

      题目的主要要求应落在这些内容的正确呈现与应用上。鲜明的视觉特征、基本结构和常见知识都可以成为有效考点，不要求知识冷门、仅属于某一个概念，也不要求每道题包含复杂推理。

      1. 明确概念与任务范围

      优先选择范围明确、在适用条件下具有可靠核心内容，并能通过图像判断的概念。概念可以指一类对象，不要求对应唯一实例。例如，“普通手动剪刀”“莜面栲栳栳”都包含不同实例，但仍有可以考察的结构、功能或形态知识。需要明确的是概念及其适用范围，不必指定现实中的某一把剪刀或某一笼食物。

      对于“建筑”“动物”“器物”等宽泛类别，应先判断该类别层面是否存在值得考察、依据可靠且能够观察的核心内容，不默认通过增加限定就一定能形成有效题目。不能仅靠增加任意颜色、数量、位置或背景细节，使题目显得具体。

      需要选择子类型，或限定地域、时期、版本等适用范围时，应围绕给定概念展开，并在题面中明确实际考察对象和条件。不能只给出宽泛名称，却暗自采用某个具体类型的要求，也不能把子类型的特点推广为整个类别的要求。例如，如果考察莜面栲栳栳的特点，题面应明确“莜面栲栳栳”，不能仅用“莜面”指代。

      宽泛与抽象是不同问题。抽象概念若具有明确、依据可靠且可视觉呈现的结构、关系或规则，可以考察。例如，“生成一个具有轴对称性、但不具有中心对称性的平面图形”，直接考察两个概念之间的区别，正确性可以通过图形判断。主要依赖自由诠释、情绪联想或作者指定象征画面的主题，原则上不纳入。例如，“画一幅表现自由的图”缺少明确的正确性边界；强行规定飞鸟、天空或打开的牢笼，也只是指定了一种象征画面，不能据此认定其他表达不正确。

      无需追求唯一实例、唯一画法或最多的知识点。找不到合适考点时，可以不出题，不以附加执行要求弥补概念内容的不足。

      2. 根据概念的核心内容，选择适用的考察方面

      以下六个方面仅用于帮助发现和组织考点，不代表每个概念都具有值得考察的对应内容。选择任何考点，都应先满足“属于概念核心内容”的前提：它应对理解该概念是什么、如何构成，或在相关条件下如何表现和发挥作用具有实质意义，并有可靠依据、能够通过图像判断。

      不要为了覆盖某个方面，刻意寻找与概念只有间接联系的事实，或额外构造缺少考察意义的条件。某项内容与概念有关，或能够被画出来，并不足以说明它适合作为核心考点。

      只选择实际适合该概念及当前任务的方面，可以只涉及一个，也可以自然结合多个；允许交叉，不要求逐项覆盖。找不到合适内容的方面直接略过，不以覆盖数量衡量题目质量。

      - **特征与结构**：身份、外形、部件、纹理及内部或外部结构，以及局部与整体的组织关系。可以考察细粒度概念之间的视觉区别，也可以考察部件如何构成正确整体。例如，常见链条传动自行车的相关部件需要形成正确的传动结构，仅出现脚踏、链条和车轮并不足够。注意区分概念特点与某个实例偶然具有的装饰或外观细节。

      - **属性与状态**：概念在特定阶段、环境、状态或版本下应呈现的表现。例如，完全撑开的雨伞，其伞面和支撑结构应与展开状态一致。对于成分、浓度、精确数值等不能从普通外观直接判断的属性，若要纳入考察，应由题目明确指定可表达、可判断的呈现方式，不能仅凭外观猜测。

      - **功能与机制**：对象的用途、工作结果，以及实现功能所需要的部件、连接或作用关系。例如，剪刀与纸并排出现，不足以表现剪刀正在剪纸。需要区分画面呈现了工作结果、结构满足了必要条件，以及展示了内部机制；不能仅凭结果或外观相似，就认定机制正确。

      - **过程与变化**：概念在明确条件下发生的变化，以及不同阶段或时刻应具有的表现。应说明需要呈现的阶段、状态及变化成立的条件，不把可能变化写成必然。例如，一张完全撑开的雨伞图片可以展示展开后的状态，但不能单独证明完整的展开过程；若考察阶段差异，应设计能够展示这些差异的任务。

      - **关系与组织**：对象或部件之间的角色、连接、接触、支撑、方向、位置、归属及组织关系。对象分别画对，不代表关系正确。例如，在指定的骑行动作中，骑手与自行车需要形成相应的姿态、接触与支撑关系。关系要求应绑定到相关对象及其适用范围，不能扩大到无关背景。

      - **规则与约定**：概念在特定制度、传统、符号系统或表示方法下遵循的规则。应保留地域、时期、版本、例外及合法变体。例如，在采用菱形表示判断节点的流程图体系中，需要检查相应节点是否正确承担判断作用，不能由一个无关的装饰性菱形代替。若考察对该体系的了解，可以指定体系和需要表达的流程，把符号与功能的对应留给模型确定。

      这些内容既可以由参考材料提供，也可以来自材料之外的可靠知识。视觉知识同样属于概念知识，不应将“视觉特征”和“知识”视为互斥类别。

      3. 选择能与核心内容结合的条件

      可以直接考察概念的核心内容，也可以通过相关状态、动作、场景或对象关系，考察这些内容在具体条件下如何体现与应用。

      用于构成考点的条件应有明确的概念依据。它可以帮助呈现某项特点，决定某条知识是否适用，或要求多个相关特点共同约束结构、作用关系及可见结果。不预设正常状态或特殊状态更好，也不以条件多少衡量题目价值。

      例如，假设材料展示了一把张开放在桌面上的剪刀，并介绍了它的结构和用途，可以设计：

      > 请生成一张普通手动剪刀正在剪纸的近景图：纸张已从边缘剪开一段，尚未剪完，清楚呈现剪刀与纸张的作用部位及已经剪开的部分。

      这道题不仅涉及剪刀结构，还需要刀刃与纸张形成合理的作用关系，已经剪开的部分也应与当前剪切位置衔接。这些要求围绕剪刀的结构和功能共同形成考察，不是无关细节的堆叠。

      参考材料可能提供基本知识而没有展示当前任务的完整结果，模型需要将知识应用到具体情境中。但“材料没有直接给出答案”不是选题目标；即使材料解释了相关原理，正确实现这些结构和关系仍然可以构成考察。

      一道题可以只深入考察一项核心内容，也可以结合多个相关内容。无需强造多跳推理。把同一事实拆成几个检查项，不等于增加了知识点；多个对象分别应用一条事实，也不能仅凭数量就称为推理。

      4. 不要在题面中直接给出核心考点的答案

      题面应交代要生成什么、处于什么条件下，以及必须展示哪些方面。对于希望模型依据概念或参考信息确定的关键表现，避免在题面中逐项展开完整答案。

      例如，可以要求：

      > 请生成一张莜面栲栳栳的食物特写，展示一笼刚蒸好的成品，清楚呈现成品的形态与可见结构。

      如果主要考察成品形态，就应将具体形态和结构留给模型根据概念知识或参考信息确定。若题面已把预期形状、结构和排列特点全部写明，任务便容易转向逐项执行描述。

      这不意味着禁止明确描述特征。特殊设定、指定状态、非典型要求和必要展示条件应写清楚；不能为了保留隐含考点而省略任务信息。隐含要求必须在指定条件下有可靠依据，不能来自作者偏好或某个实例的偶然细节。

      可以用以下问题检查题目：

      - 如果完全不了解概念，只按题面逐项绘制，是否就能满足大部分核心要求？若是，检查是否已经把准备考察的内容写成了答案说明。
      - 如果换成另一种对象，主要要求几乎不变，是否说明难度主要来自通用的摆放、计数或修饰要求？概念之间可以共享知识，因此这只是检查线索，不作为直接淘汰条件。

      发现问题后，应调整概念、条件与考点之间的联系，不能仅靠删去描述使题目变得含糊。

      **三、材料与知识依据怎样使用**

      1. 如实说明依据

      考点可以依据题面明确给出的设定、参考材料以及你掌握的可靠概念知识。不同考点可以有不同依据，同一考点也可以得到多种依据的支持。

      允许引入材料之外的可靠知识，但需要明确具体事实及适用条件。对于声称由材料支持的要求，应能说明材料提供了什么、如何支持该要求。不能用自身知识替换材料内容，再声称结论来自材料；需要额外知识才能成立的结论，应如实说明额外依据。

      2. 区分图像证据、文字信息与推论

      声称图片展示了什么，应以实际可见内容为准。标题、概念标签或模型描述不能替代图像证据。文字可以独立提供知识，但不能因此认定这些知识已经在图片中得到展示。

      单张实例图不自动证明整个类别的一般规律。不要把某个地区、时期、版本或状态下的陈述推广为普遍规则，也不要把关联写成因果、可能写成必然，或把尝试写成已证实有效。

      3. 检查可靠性与适用范围

      材料与作者已有知识都可能出错。应检查概念对应、内容范围及图文一致性，不能默认任何一方绝对正确。

      发现关键冲突或无法确认的事实时，应核实、限定适用范围、调整考点或放弃候选。不能悄悄修正材料后仍声称结论由材料推出，也不能把存疑事实作为确定的正确性标准。

      材料准确也不意味着其中每个细节都是必要要求。应区分当前条件下应具备的特点、允许变化的实例细节，以及尚不能确定的内容。

      4. 允许材料提供关键答案信息

      参考材料可以提供核心特点、相关知识或关键视觉表现，不要求题目刻意避开材料已经呈现的内容。

      某张参考图已经满足题目要求，不自动导致题目无效。但在提供该图时，复现已有表现就可能完成任务，不能据此声称该题必然要求新的条件判断、关系组合或知识推导。

      需要考察进一步应用时，应围绕概念核心内容选择有意义的条件。例如，“剪纸”可以调用剪刀的结构和功能；不能仅为避免与参考图重合，就增加无关对象、改变背景或强加特殊操作。

      材料是否存在、是否有帮助、是否不可替代，以及模型是否实际使用了材料，是不同问题。不能仅凭提供了材料或模型答对，就判断它使用了材料。

      **四、题目与考察内容怎样对齐**

      设计题目时，需要明确答案是否可以检查、具体检查什么。这里的判据用于出题自检，不作为单独交给 judge 的逐项评分清单，也不要求输出自检过程。

      - **要求有依据，也属于当前任务。** 检查内容应能从题面及适用的材料或可靠知识合理推出。某项概念知识为真，不等于当前图像必须展示它；不能仅因材料提到了某个事实，就追加为隐藏要求。

      - **明确可见的判断依据。** 对核心考点，应能说清图中观察什么，什么表现支持满足要求，什么表现构成违反，以及哪些情况无法确认。依据用于支撑知识是否成立，判据用于判断图像是否满足要求，两者不能互相替代。

      - **保留关系本身。** 可以分别检查可独立判断的问题，但不要把一个关系要求拆成元素是否出现。例如，检查链条与传动部件的连接关系，不能被“链条出现了”“部件出现了”替代。考点与检查项不必一一对应。

      - **题面包含必要展示要求。** 核心考点应在合理遵循题面的图像中具有可观察依据。必要的展示范围、尺度、状态或视角要求应写入题面，限定到足以判断为止，不固定唯一构图，也不要求所有特征同时可见。可以采用具有足够身份上下文的局部展示。

      - **展示方式服务于考点。** 内部结构或机制可以通过自然可见部分、剖面、示意等合适方式呈现，具体方式由考点决定。必要时在题面明确要求，不用正确文字代替应当画出的结构关系。切开、拆解等操作应与核心内容有实质联系，不能仅为方便检查而加入。

      - **允许合理答案变化。** 不以参考图的偶然细节、无依据数值、作者偏好或唯一像素布局作为标准。区分必须满足的内容与不影响考点的风格、视角、布局、背景及合法实例差异。

      - **难度来自核心内容及其应用。** 避免无关的实体堆叠、复杂场景、长链要求、排版或氛围等附加负担。光学、阴影、计数、微小结构等本身属于核心考点时可以考察。若删去某个要求后，核心内容、应用方式、任务明确性和可判断性均不受影响，且该要求只增加执行负担，通常应删除。

      定稿前检查：

      - 是否存在符合题目及适用知识，却会被预期检查方式误判的合理画法？
      - 是否存在合理遵循题面展示要求，却仍无法观察核心考点的画法？
      - 是否需要作者补充题面未交代的条件，才能决定答案对错？

      发现问题时，调整题面、考点或检查方式；无法解决时放弃候选。

      判断针对最终图像是否正确，不推断模型内部具有哪些知识、进行了怎样的推理，也不预言某个模型必错、参考必有增益或题目必有训练价值。

      **五、输出**

      只输出 JSON。一道题保留完整题面，以及一个或多个紧密相关的简短考点及依据。不单独输出判据、评分清单、知识空缺分析、难度标签或设计过程。

      - `instruction`：完整、可独立理解的题面。
      - `test_points`：考点列表。每项包含：
        - `point`：简短说明考察哪项概念核心内容，以及必要时在什么条件下应用。
        - `basis`：说明支撑该考点的具体事实和必要适用条件。来自材料时，引用输入已有的材料编号并说明支持内容；来自自身知识时，写明具体知识；共同支持时简短说明。不要只写“依据常识”，不要伪造引用、来源或链接，也不要展开成完整评分清单。

      材料编号可以出现在依据说明中，不应成为题面理解所必需的指代。

      每次只返回一道完整题目。选择有代表性的概念核心内容，不为覆盖概念而把多个独立考点堆进一题；一道题可以包含紧密相关的多个考点。找不到合格题目时返回 question: null 并说明原因，不勉强出题。

      输出格式如下，示意文字应替换为实际内容：

      ```json
      {
        "question": {
          "instruction": "完整题面",
          "test_points": [
            {
              "point": "考察的概念核心内容及相关应用",
              "basis": "支持该考点的具体材料内容或可靠知识，以及必要的适用条件"
            }
          ]
        }
      }
      ```

      没有合格题目时输出：

      ```json
      {
        "question": null,
        "reason": "简要说明尚未解决的事实可靠性、任务明确性或可检查性问题"
      }
      ```

      有题时不输出不足原因。将上述业务 JSON 放入响应的 result 属性。
      {% if payload.references %}
      以下 references 是本次提供的独立文字和图片材料，编号固定。
      不假定文字与图片存在配图对应关系；image_number 对应后面实际图片的顺序。
      {% else %}
      本概念没有提供参考材料，请依据你掌握的可靠知识出题；不能虚构材料或引用。
      {% endif %}
      {{ payload | json }}
      {{ images | numbered_image }}
    response_schema:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          type: object
          required: [question]
          additionalProperties: false
          properties:
            reason:
              type: string
              minLength: 1
            # 是否有题由业务检查；非 null 时按此字段契约校验为单个 object。
            question:
              required: [instruction, test_points]
              additionalProperties: false
              properties:
                instruction: {type: string, minLength: 1}
                test_points:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [point, basis]
                    additionalProperties: false
                    properties:
                      point: {type: string, minLength: 1}
                      basis: {type: string, minLength: 1}
