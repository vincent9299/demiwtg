      ### 弱项枚举（weak_points 多选：本题全部结论命中的模型视觉弱项，去重）

      镜面倒影 / 尺度并置 / 剖面暴露 / 精确计数 / 文字字样 / 接触交互链 / 长尾色材 / 动态模糊 / 朝向左右 / 部件数目 / 光影一致性 / 手部细节 / 人体姿态 / 物理现象 / 化学产物 / 生态关系 / 受力形变 / 其他

      各表与枚举**均允许自行扩展**：现有类名不足以刻画时，可自造简短类名（四字以内）填入统计字段——新类名会进入批次统计与削峰/补峰回路；削峰禁令同样可能引用自造类名，含义按第二节各表的定义口径理解。例外两条：门槛中的场景来源计数只认表内固定行（见门槛口径说明⑤）；**知识域为封闭枚举**（跨域注入与主域匹配依赖标准域名单，不自造）。

      ## 三、题目是什么

      题目由两部分组成：

      1. **题面**（gen_prompt）：一段文字，发给被评测的文生图模型作画。
      2. **视觉推理过程**（reasoning）：本题的全部视觉推理，形如 **概念知识点 + 前提 + 组合 + 多跳 = 视觉结论**，写法见出题步骤第 3 步。它是题目的**质量与审计载体**：难度门槛从它计数（前提、组合、知识类别、跳数、结论数），闭合回验与逐题复审以它的每个 [结论]、[不得画] 终端为核验单元。生产判分不消费 reasoning——判官按通用规则三维独立判分；结论清单制判分为休眠备选路径，启用时才以终端节点为判分对象。

      题面点名的概念在现实中自带大量视觉事实——点名「波音 747」即蕴含四发布局、机头驼峰、多轮起落架；这些题面没有写，但任何正确的画面都必须满足，它们是视觉推理过程的素材（直觉级事实如四发布局可作推导的起点/背景知识，但不得作为计分的 [结论]，见第 2 步直觉级蕴含不入题）。概念不限于实体：现象、事件、过程、文化规制同样适用——题面写「极光」且锁定「常见的绿色帘幕状极光」时，才可写出对应的蕴含；只点名「极光」而未锁定形态颜色时，不得把特定形态写成必然结论。

      ## 四、出题步骤

      1. **考点设计**：候选知识 + 前提设计 + 组合设计 + 多跳设计 → 视觉推理过程（概念知识点 + 前提 + 组合 + 多跳 = 视觉结论）。前提、组合、推理互相依赖：前提解锁或吸收推导，组合生出关系推导，推导的形态反过来决定需要什么前提与组合。设计分五部分——知识挖掘供原料，场景设计供容器（前提与组合在场景中自然落位），前提设计、组合设计、多跳设计把原料组装成视觉推理过程：

         - **知识挖掘**：列出该概念的候选知识事实（每条 = **知识事实 + 它在画面上的样子**；不要求穷举，但至少覆盖第二节知识类别表各类各若干条）。
            知识不限于概念自身——通过组合，其他域的知识也进入这张图（食物 × 化学：切开的苹果果肉暴露空气后氧化变褐）。29 域的知识都是素材，每条知识都落到「它在画面上的样子」。

           挖掘的知识**只取公认事实**：任何具备该领域常识的人都会承认的事实。不得取冷僻细节、只对特定子变体成立的事实（仅某品牌某型号才有的特征）、以及你自己没有把握的内容。长尾与冷僻的分界：长尾 = 领域内公认、而模型先验常缺的事实（该领域常识者会承认）；冷僻 = 需查证才能确认或有争议的事实——前者可用（L3 的长尾结论指此），后者禁用。若概念的高价值蕴含恰好只在某个子变体上成立，应在题面中点名该子变体再写入推理。**普适成图常识不写入推理**：与题面画哪个概念无关、对任何图都成立的知识（人有两只手、光影自洽、透视正确）由判分侧的通用规则处理，写进推理只会稀释题目的判别力。

           > **29 域菜单**：知识域枚举与跨域注入口径见第二节「知识域」表；组合自然性要求（真实视觉交汇、非视觉域须映射可见载体）同此处恒定适用。


         - **场景设计**：场景是前提与组合的容器——先设计一个丰富而自然的场景（事件、时刻、环境、活动、多对象同框互动），让前提与组合从场景中自然生长，而不是往简单场景上贴道具。场景越丰富，能同时成立的前提、组合与结论越多，难度自然上来：多对象、多状态、多关系并存的复杂场景（工地卸土的瞬间、颁奖升旗、训练馆里的镜墙）天然提供高前提密度与高组合度。场景复杂度是难度七维之一（见第 2 步）。它与前提密度、组合度天然相关——实体密度同时意味着前提更多，关系一致同时意味着组合约束更多；这种维间相关不算重复计分，层级判定以量化门槛整体执行。复杂度的上限是自然性——真实世界不可能存在的场景是另一种硬凑。场景复杂度来源类别表见第二节（scene_types 枚举）。

         - **前提设计**：前提 = 题面在概念名之外锁定的一切条件。前提按原子计：能独立改变合法画法集合的条件各计一个前提（「夜间机场」计夜间、机场两个前提）；不得为凑门槛拆合条件。题面锁定一个前提，对应的推理变为可考（着陆 → 扰流板、襟翼、拉平、反推），同时推理的前段被题面吸收为已知（锁定「自溶阶段」后「自溶」不算一跳）。前提类别表见第二节。
         - **组合设计**：组合 = 多个概念同框，生出单个概念都不具备的关系推导；关系约束互相牵扯——一处画错常连带错一片，考的是「多个知识点同时成立时能否都画对」。组合类型表见第二节（combo_type 枚举）。
           前提与组合可叠加（着陆的 747 映在航站楼玻璃幕墙里）。

           **组合类型选择**：组合类型由概念与场景的自然视觉交汇决定——先在内部列出候选组合（≥3 个，来自不同类型，可超出下表自行扩展；筛选过程不要求写入输出），从中选约束强度与牵扯程度最高、且视觉交汇最自然的一个；自然性不足的组合不得选用（不以难度覆盖自然性）。输入下发削峰禁令时，候选与选定组合不得落入禁用主类，跨度避开域不再作为知识来源（见输入节）。

         - **多跳设计**：推导从题面已知条件（概念 + 前提 + 组合）出发逐跳搭成：一跳 = 一条有向边，由左侧已知节点推出右侧一个新知识事实节点，跳数按路径的边数计算；最后一跳落在具体视觉结论上。题面锁定的前提与组合作为推理的起点，不计入跳数。跳类型表见第二节（hop_types 枚举）。
           推导逐跳校验：每一跳单独成立且是公认事实，任何一跳断裂其推出的结论一并作废；同一事实的复述拆解不算跳（煮熟→吸水→变软形式上有两条边，但节点只是同一常识过程的拆词复述，边无效、不计跳数，是伪推理）。

      2. **难度评估**：难度作用于**题目**——题目 = 题面（概念 + 前提 + 组合）锁定的约束空间；本题的层级目标是输入给定的目标层级。题目难度七维：

         | 维度 | 含义 | 难例 | 易例 |
         |---|---|---|---|
         | 前提密度 | 题面锁定的前提数量与具体程度 | 着陆触地 + 夜间 + 机场环境同时锁定 | 仅点名概念 |
         | 蕴含深度 | 题面已知到视觉结论需要多少新独立事实（推导的跳数） | 触地→滑跑减速→扰流板升起 | 煮熟→变软 |
         | 知识长尾 | 知识离模型先验有多远（领域内公认而先验常缺——冷僻/有争议的禁用，见知识挖掘） | 长尾概念的精确细节 | 著名实体的大众认知 |
         | 知识跨度 | 推理动用的不同知识**类别**数量（按第二节知识类别表计类）；另设**跨域注入**——按 knowledge_domains 自报的**主域之外去重域数**计数（域数口径，非节点数），保证长尾世界知识不只来自概念自身域 | 医护协作约束患者：概念自身结构＋物理规律＋生物规律，跨医学之外的域 | 单类静物、零跨域 |
         | 结论约束强度 | 约束空间要求的视觉结论的精确程度、约束强度 | 主起落架支柱恰好四根、徽标确切字样 | 「有发动机」 |
         | 组合度 | 跨概念一致性约束的数量 | 接触点遮挡一致、尺度并置的比例透视 | 单概念独立 |
         | 场景复杂度 | 场景承载的复杂度来源广度与深度：实体密度、交互链环数、多主体过程与环境差异（见第二节场景复杂度来源表） | 医护协作约束患者：接触链＋器械状态＋仪表读数联动 | 单主体静物、空背景特写 |

         难度单调性：**独立且不泄漏的前提越多、跳越长、知识越长尾、跨度越广、结论约束越强、组合越多、场景复杂度来源越广（实体更密、交互链更长），题目越难**（前提若泄漏结论或吸收推导，不增难度）。负向约束只有在钉在**混淆点**上时才构成难度——混淆点 = 模型高频会画错的刻板印象（完备推理下不可能出现、模型却惯于画出）；任意缺席（「不得画大象」）无判别力，不构成难度。

         **结论的判别力 = 离模型刻板的距离**：刻板 = 模型不动用精确知识、凭先验最可能画出的默认画法；结论与刻板的偏离越大越有判别力，[不得画] 是它的负向形式。每个结论自问一句：模型靠刻板先验就能画对吗？能 → 该结论无判别力，替换。反刻板自问是每条结论的过滤器（不过即弃）；门槛中的「反刻板结论 ≥N」指与模型默认画法形成直接对抗的显著反刻板结论，其余结论过自问即可——两个口径不冲突；整题层级由量化门槛整体判定。

         **题目分层（量化门槛，各项须同时满足）**：

         | 层级 | 量化门槛 | 例 |
         |---|---|---|
         | L1 简单 | 前提密度：前提 ≥6，覆盖前提类别 ≥3 类；蕴含深度：最长推导 ≥4 跳，覆盖跳类型 ≥2 种；结论约束强度：正向结论 ≥5 且互相牵扯、强约束 ≥2（低基数数量/短字样/粗粒度方位，数字不超过十）、反刻板 ≥3；知识长尾：长尾、负向、弱项组合至少占其二；长尾强约束交叉结论 ≥1；知识跨度：≥3 类；跨域注入 ≥1（主概念域外知识节点）；组合度：关系约束结论 ≥2；场景复杂度：来源 ≥3 类 | 「夜间小雨的机场跑道上着陆触地的 747 侧近景」前提[触地、夜间、小雨、机场、跑道、侧近景]：扰流板升起、襟翼放出、抬头姿态互相牵扯 + 主起落架恰好四组（强约束）+ 不得画螺旋桨（混淆点负向） |
         | L2 中等 | 前提密度：前提 ≥8，覆盖前提类别 ≥4 类；蕴含深度：最长推导 ≥5 跳，覆盖跳类型 ≥2 种；结论约束强度：正向结论 ≥6 且互相牵扯、强约束 ≥2 且含高精度一条、反刻板 ≥4；知识长尾：长尾结论 ≥2；**长尾强约束交叉结论 ≥3**；**高精度结论 ≥1**（精确字样 ≤6 字符优先；概念无自然字样载体时，以确切计数、纹样字形或徽记形态替代，并在 level_reason 注明所选项）；知识跨度：≥4 类；跨域注入 ≥2；组合度：关系约束结论 ≥3；场景复杂度：来源 ≥4 类；命中模型视觉弱项 ≥2 且互不相同；[不得画] ≥1 且钉在混淆点 | 「小雨黄昏的机场跑道上着陆触地的 747，整机与航站楼玻璃幕墙倒影同框完整入画」前提[触地、黄昏、小雨、机场、跑道、侧后略高机位、幕墙同框、整机完整入画]＋组合[镜像]：扰流板镜中同步多跳推导 + 主起落架四组（强约束）+ 倒影不得画多余发动机（混淆点负向） |
         | L3 困难 | L2 全部门槛之上再叠加，且跳类型升至 ≥3 种：**弱点乘积结论 ≥2**（一条结论同时命中两个弱项——镜中字样反转＝镜面×文字、倒影确切计数＝镜面×精确计数、透镜后域特定色材＝光学传播×长尾色材、多人各持器械的精确分工＝多人物×接触交互）；长尾强约束交叉结论 ≥5；**高精度结论 ≥2 且含一组「正确值×混淆值」配对**（字样类优先：正确字样配 [不得画] 混淆字样；概念无字样载体时，以计数或纹样的「正确值×混淆值」配对替代）；弱项 ≥3 且互不相同；镜面在此档解禁（削峰分级豁免，批内仍受总量约束）| 「小雨黄昏机场跑道着陆触地的 747 整机映在玻璃幕墙里，机身注册号与倒影同框可读」前提 8 个＋组合[镜像×文字]：倒影中注册号字样左右反转（弱点乘积）+ 近侧主起落架恰好两组（强约束）+ 倒影不得画多余发动机、注册号不得正写（混淆字样对） |

         **门槛口径说明**：①高精度结论 = 确切数量（≤10）、确切短字样、纹样字形——仍受撰写规则 2 上限约束，不要求精细比对；②层级按整体递进设计，个别维度跨层同值（如前提与强约束 L2=L3）由其余维度抬升（前提阶梯 6/8/8——L3 与 L2 同值，由弱点乘积/交叉/字样台阶区分）；③最长推导须落在主体考点上，不得以与主体无关的孤立长链凑深度；④结论计数以独立视觉事实去重——同源属性拆条不重复计入（机审按标注数从宽，抽样复审按事实去重）；⑤场景复杂度来源的**门槛计数**只认第二节表内固定行（行数以表为准，不在此复述数字）；自造来源类名可入统计字段与削峰回路，但不计入门槛的场景来源数——防自造凑门槛；⑥送分型结论（阶段可见、环境在场、风格符合类）不计入正向结论门槛计数——把结论预算留给咬得住的约束；⑦长尾强约束交叉结论 = 长尾知识与精确值约束的**乘积结论**（域特定颜色＋计数＋排列的纹章式考点），机审不可数，自查申报计数、抽样复审。⑧弱点乘积结论 = 一条结论同时落在两个弱项上（弱项×弱项的乘积考点，判别力高于单弱点结论的叠加），机审不可数，自查申报、抽样复审；⑨削峰分级豁免由**驱动侧执行**：对目标层级 L3 的题，驱动不下发镜面类削峰禁令（弱点乘积需要镜面素材），并在道内镜面计数（光学媒介＋光学传播）≥2 后恢复禁令——批内总量约束由此落地，协议端不覆盖已下发的禁令。⑩前提类别与跳类型多样性按统计字段 premise_types / hop_types 去重计数（枚举见第二节对应表，可自造四字类名）；前提类别表与跳类型表由本条进入门槛覆盖；⑪前提计数只认**场景设定性条件**（锁定状态/环境/数量编组/视角等）——与概念固有视觉属性重复的答案级描述（颜色/形态的直给）不是前提：若该属性可由已锁前提推出，它是结论侧内容，写进题面即泄漏。

         **互相牵扯** = 结论之间存在明确的一致性约束（同步、镜像、接触、尺度、守恒、因果——如扰流板升起与其倒影同步）；共享前提是必要条件但不足够：两条都由「夜间」触发但互不影响对方的结论不算牵扯。门槛中的「互相牵扯」指结论构成**连通的牵扯组**——约束关系连通即可，不要求两两直连，组规模即结论数门槛。

         表中示例为缩略示意，只示代表性结论；实际出题须满足量化门槛的全部项。

         **直觉级蕴含不入题**：顺着题面正常作画就画得对的结论（四发布局、煮熟面条柔软）在任何层级都不计——它是白送分，不写进题目。跳数是各层级的硬性必要门槛之一，但非唯一判据：层级以量化门槛整体判定，跳数少的负向结论不因跳数少而豁免混淆点要求；跳数多但各维全低的推导（面条吸水变软式）是伪难度，同样不写。结论数量同样构成难度：同时成立的视觉结论越多、约束越互相牵扯，模型画错至少一条的概率越高。高价值结论不足时更换角度（换前提、换组合、换场景）回到第 1 步再挖，绝不用低难度结论凑数。**不可出题分支**：概念确实无法支撑目标层级时，输出 `status: "cannot_construct"`、`level`/`gen_prompt`/`reasoning` 以空字符串输出（字段不省略）、`notes` 写明卡住的维度，不得硬凑或降级交题。

      3. **撰写视觉推理过程**：整题的视觉推理写成一个 **DAG（有向无环图）**：前提、组合、知识点、视觉结论是节点，推导关系是边；节点可分叉、可汇合、可被多条推导共用——它不是并列的线性链，输出用文本记号表达：

         | 记号 | 含义 |
         |---|---|
         | `+` | 多个依据共同推出：`A + B → C` |
         | `→` | 推导：左为据、右为结论；多跳用 `→` 串联，每一跳是一个独立的公认事实 |
         | `[结论]` | 标记视觉结论节点（生成图中可直接核验） |
         | `[不得画]` | 标记负向结论（完备推理下不得出现的视觉内容）；**必须钉在具体混淆点上**并在该推导行内注明混淆源——模型高频会画错的刻板印象（高铁电驱不得画蒸汽，混淆源：蒸汽机车印象）。「不得画大象」这类任意缺席无判别力，无效。负向结论必须绑定作用对象（「目标 747 的发动机位不得出现螺旋桨」）；背景中其他物体出现相似元素不构成违反 |
         | （前提）/（组合） | 标注节点来源；前提必须由题面锁定，组合必须由题面点名；同一条件只按一类标注计数——跨概念关系标（组合）、单体条件标（前提），不得双重标注 |
         | （知识·类别） | 知识节点标注所属知识类别（取第二节知识类别表行名，如（知识·化学规律）；可自造四字类名），供知识跨度计数与核验；一个知识节点只标一个主类别，不得多类别重复标注抬跨度。可选**复合标注**（知识·类别；域·域名）——分号后再标该知识的来源域（29 域菜单名），实现节点级双轨溯源：类别段计跨度、域段供跨域与批次域分布复核 |

         撰写规则：

         1. **每跳一个独立事实**：每条 `→` 是一个公认事实，复述拆解不算跳；任何一条边断裂，其推出的全部结论一并作废。
         2. **视觉结论可直接核验**：有/无、颜色、形态、状态这类判别性特征优先；避免需要高精度计数、精细比对的结论（判分模型的计数与细节辨识能力有限）。数量类确有必要时，数字控制在十以内。禁止「意境磅礴」「美观大方」这类非视觉表述——每个视觉结论都应能转写成一个明确的图像判定问题（存在、缺席、属性或关系四类）。一个 [结论] 只回答一个判定问题：含并列特征的结论必须拆成多条。析取事实（「棕榈枝或地域替代树枝」）必须列全合法变体及其适用条件；适用条件锁不定的，不得写成结论。
         3. **闭合**：每个 `[结论]` 对最终题面的所有合法画法成立；依赖题面未锁定前提的推导不得写入（闭合回验在第 5 步执行）。
         4. **交互链逐环成结论**：A 对 B 的动作、B 的受力形变或状态变化、B 与 C 的新关系各自独立成 [结论]，环间牵扯以一致性约束成立，不为链另设记号。
         5. **前提与跳数的关系**：跳数以题面已锁定的信息为度量起点——前提是推理的根节点，锁定的事实不计入跳数（锁定「着陆」后，「着陆」本身不算一跳），跳数计的是其余推导边。前提决定**结论何时必然成立**（闭合），跳数是**蕴含深度维度的计数**（难度七维之一）。

      4. **撰写题面**：题面 = 概念 + 锁定的前提 + 组合对象 + 场景。默认单幅、单一连续视域的具象图像；拼图、多视图、剖面示意仅在题面显式锁定时允许。撰写时遵守：

         1. 题面的每一条显式规定——数量、颜色、姿态、空间位置关系、点名的材质/表情/场景、锁定的时刻与状态——都写得明确，只有一种正确读法。含糊的题面让结论的核验依赖猜测，整题作废。
         2. 题面为视觉推理提供依附点：选择知识蕴含丰富的概念状态——时刻、阶段、环境、年龄、使用状态——作为题面的素材。
         3. **视角与取景支撑可见性**：题面锁定的视角与取景必须让每个 [结论] 在画面中可见——每条结论的核验区域（机背、机腹、底部、内部、倒影面……）都要呈现在题面的取景内。场景选择是设计手段：某结论在当前场景下不可见时，更换更合适的自然场景，多轮迭代，直到找到一个让全部结论自然可见且难度不降的场景——不靠取景条款硬凑全方位可见，不靠剪掉推导回退难度。可判性条款只写必需的最小集，每题不超过两句，不堆叠「无遮挡、细节清晰」类套话。
         4. **无闲置前提**：题面锁定的每个前提至少被一条推导使用；与任何结论都无关的前提不写进题面（闲置前提只会稀释判分、挤占模型注意力）。
         5. **无遮挡场景**：题面锁定的环境与氛围——浓雾、逆光剪影、无照明的夜色、极远景——不得妨碍结论的核验；结论要求精确细节时，场景必须支持该细节的可见度。
         6. **不重复**：视觉结论不得与题面显式规定重复——重复的内容由题面自身承担，不写入推理。
         7. **防泄漏**：视觉结论、推理的中间跳转，都不得写进题面——写进题面等于把答案告诉考生。题面只点名概念、给场景、给前提。例外：子变体名（如「幼年」「-400 型」）作为前提可以写进题面——算泄漏的是前提蕴含的视觉结论，不是前提名本身。
         8. 不无中生有：不写画面不必承担的规定，不编造与概念不符的前提。
         9. **场景承载须点名**：实体密度、交互链、多实例对比所涉的实体与组合对象必须在题面点名——未点名实体不得成为应存在类结论对象；对其只能写条件式结论（不计门槛，见定稿），不构成冲突；规约场景、环境作用以场景词或环境前提锁定。

         题面与视觉推理过程按输出格式组装（只输出一个严格 JSON 对象，不要 markdown 围栏，不要其他文字）：

         ```
         {
           "qid": "输入给定的题目编号",
           "status": "constructed 或 cannot_construct（正常出题可省略）",
           "gen_prompt": "题面",
           "level": "L1 或 L2 或 L3",
           "level_reason": "该层级的七维依据（逐维给出计数与达标结论，不只列高维）",
            "combo_type": "本题主组合类型（第二节组合类型表之一，可自造简短类名扩展；供批次分布统计）",
            "scene_types": ["场景复杂度来源类名数组（多选；可自造简短类名扩展）"],
            "hop_types": ["跳类型数组（多选；可自造简短类名扩展）"],
            "weak_points": ["本题全部结论命中的模型视觉弱项数组（第二节弱项枚举多选、去重；供弱项门槛核验与批次分布统计）"],
            "knowledge_domains": ["推理实际动用的知识域数组（29 域菜单名，含主概念所在域；供跨域注入核验与批次分布统计）"],
            "premise_types": ["题面锁定的前提类别数组（第二节前提类别表行名多选；供门槛与批次分布统计）"],
           "reasoning": "视觉推理过程文本（第 3 步记号）",
           "notes": "需要人工注意的事项，可空"
         }
         ```

      5. **定稿**：确认题目层级与七维依据已按第 2 步评估写明、知识节点域标注齐全；随后**闭合回验**——每个视觉结论必须对最终题面的**所有合法画法**成立。合法画法 = 遵守题面全部显式规定、具象可辨识的单幅图像；风格、媒介、遮挡、裁切、构图在题面未锁定时均可自由变化；题面已按撰写规则 3 锁定视角与取景后，构图层面的遮挡与裁切不再是自由变化维度；画面内主体与道具造成的遮挡仍须按撰写规则 3 与无遮挡场景条款保证核验区域可见——结论需要可见而题面未支撑的，视为违规题。题面没有锁定的东西——构图、视角、距离、环境、在场者——不得成为「应存在」类结论的对象：一张合法画面完全可能不画它。想考某个元素，只有两条路：在题面里把它锁定（写成显式前提），或改写成属性式结论（「若画面出现 X，X 应符合……」）——条件式结论不计入正向结论数量与难度门槛计数。凡依赖题面未锁定前提的推导删除或改写。

         > 反例：题面「管晨辰平衡木成套动作刚结束的瞬间」，结论「平衡木附近有坐在评判席的裁判组」——不画裁判的运动员特写是合法画法，该结论对所有合法画法不成立，作废。修法：题面改写为「……动作刚结束，面向评委席致意的瞬间」（裁判入画成为显式前提），或放弃该推导。

      6. **交题前自查**（必须逐条深入、全面、仔细自查，严禁跳过；任何一项存疑即按第 13 条回退重做，不得带疑交题）：

         1. 题目层级满足量化门槛的七维全部条目（以第 2 步门槛表为唯一规范源，本条为复述、冲突时以第 2 步为准；L1：前提 ≥6 覆盖类别 ≥3、跳 ≥4 覆盖跳类型 ≥2、正向结论 ≥5 互相牵扯、强约束 ≥2、反刻板 ≥3、长尾/负向/弱项占其二、长尾强约束交叉 ≥1、关系约束 ≥2、场景来源 ≥3 类、跨度 ≥3 类、跨域注入 ≥1；L2：前提 ≥8 覆盖类别 ≥4、跳 ≥5 覆盖跳类型 ≥2、正向结论 ≥6 互相牵扯、强约束 ≥2 含高精度、反刻板 ≥4、长尾结论 ≥2、长尾强约束交叉 ≥3、精确字样 ≥1、关系约束 ≥3、场景来源 ≥4 类、跨度 ≥4 类、跨域注入 ≥2、弱项 ≥2 且互不相同、[不得画] ≥1 钉混淆点；L3：L2 全部之上（跳类型 ≥3）——弱点乘积结论 ≥2、长尾强约束交叉 ≥5、精确字样 ≥2 含混淆字样对、弱项 ≥3 且互不相同？每个结论都过了「模型靠刻板能画对吗」的反刻板自问，没有直觉级白送分结论，反刻板结论数量达到该层级门槛？条件式结论（「若画面出现 X…」）一条也没有计入任何门槛计数？送分型结论（阶段可见、环境在场、风格符合类）同样未计入正向结论门槛？
         2. **闭合规则**：每个视觉结论都对题面的所有合法画法成立？没有对题面未锁定要素的「应存在」结论（构图、视角、环境、在场者）？实体密度、交互链、多实例对比所涉实体与组合对象都在题面点名？
         3. **难度七维**：题目的前提密度、蕴含深度、知识长尾、知识跨度、结论约束强度、组合度、场景复杂度七维画像与所标层级相符？每条推导的每一跳都引入新独立事实（同义复述拆句不算跳）？没有跳数多但各维全低的伪推导（面条吸水变软式）？知识节点全部带类别标注、去重类别数达到跨度门槛、且每个知识节点只标一个主类别？（前提）/（组合）无同一条件双重标注？场景复杂度来源计数达到门槛？交互链每一环都是独立 [结论]？互相牵扯的结论构成连通牵扯组（靠一致性约束连通，而非仅共享前提）？
         4. 推理上的知识点与跳转事实都是公认事实——没有冷僻细节、没有拿不准的内容、没有未点名子变体的变体特异事实？
         5. 推理逐跳成立——任何一条边断裂，其推出的结论一并作废？
         6. 视觉结论都是图中可直接核验的可见特征：无超过十的计数、无「意境/美观」类话术、每个 [结论] 只回答一个判定问题（无并列特征挤在一条、析取已列全合法变体）？
         7. 题面没有视觉结论与推理中间跳转（无泄漏）？题面的每条显式规定只有一种读法？
         8. 推理里没有普适成图常识（人手两只、光影自洽这类对任何图都成立的内容）？
         9. 每个 [不得画] 都钉在具体混淆点（模型高频会画错的刻板印象）并注明混淆源？没有「不得画大象」这类任意缺席？
         10. 题面的视角与取景支撑每个 [结论] 画面上可见（没有结论落在背面、取景外）？可判性条款不超过两句、无「无遮挡、细节清晰」类套话堆叠？没有闲置前提？没有妨碍核验的遮挡场景（浓雾、逆光剪影、极远景）？
         11. **难度校验**：题目难度达到输入的目标层级（`level` 如实标注实际层级，阈值按实际层级执行——超层也须满足高层级门槛）——场景丰富而自然（不是往简单场景上贴道具硬凑约束），没有为凑可见性或闭合而砍考点、简化推导，没有伪难题（跳数堆砌、复述拆解、任意缺席凑数、组合不自然）？交叉与乘积结论是从概念自然长出的考点，不是纹章字样的机械堆贴？
         12. **统计字段与动态调整**：combo_type / scene_types / hop_types / weak_points / knowledge_domains / premise_types 六字段都已填写（表内类名或四字内自造类名，不含空串）？输入下发的削峰禁令一条也没有违反（未使用禁用组合主类、未引入避开域知识）？未应召的补峰征召已在 notes 注明原因？
         13. **整体校验与分型回退**：任何一项不满足，按问题类型回退——知识/组合问题回第 1 步，层级问题回第 2 步，DAG 问题回第 3 步，题面可见性问题回第 4 步，格式问题直接修输出；换前提或组合后，跳数、结论数、可见性、闭合、层级全部重算，不得只做局部复核。全部满足才交题。

      ## 五、示例题（L3 困难；概念＝波音 747；含光学组合与负向排除）

      > 本示例为**记号与结构示意**（域标注、DAG 记法、七维画像格式）：其 level 与门槛计数不满足现行量化门槛，仅示意格式；实际出题须满足第 2 步量化门槛的全部条目。

      题面：一张黄昏时分波音 747 主起落架刚接触跑道的照片，整机与航站楼玻璃幕墙倒影同框完整入画，略高侧视角

