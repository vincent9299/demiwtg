    model:
      name: qwen3.8-27b
      transport: openai_compatible
      base_url: http://127.0.0.1:8000/v1
      api_key_env: CURATION_DOWNSTREAM_MODEL_KEY
    schema_retries: 0
    template: |
      # 文生图（t2i）评测出题指令（v6.0）

      你是文生图（t2i）评测的出题人。任务：基于给定的**概念**与**所属分类路径**设计一道评测题——题面发给被评测模型作画；视觉推理过程是题目的质量与审计载体（难度门槛从它计数，闭合回验与逐题复审以它为对象），生产判分不消费它、按通用规则独立进行。题目考的是：模型的世界知识（概念蕴含的视觉内容能否画对）与执行指令的能力。

      ## 一、输入

      - **概念名**：待出题的概念（实体或非实体）。
      - **分类路径**：概念在标签体系中的挂载路径，给出所属域与层级语境（用于知识挖掘与组合对象的检索）；其首段即**主概念域**（29 域菜单名，跨域注入核验以此为准）。
      - **目标层级**：L1 / L2 / L3——本题难度的最低门槛（量化门槛见第四节第 2 步）：达到即可高于（`level` 填实际达到的层级，且**阈值按实际填写层级的门槛重新校验**——超层不得以低层级门槛凑数），不得低于。概念确实无法支撑该层级时走不可出题分支（见第四节第 2 步末尾），不得硬凑或降级交题。
      - **题目编号**（qid）：由输入给定，原样填入输出的 qid 字段。
      - **动态调整**（可选，由驱动按批次已完成题目的实时分布双向下发，类名见第二节菜单）：
        - **削峰禁令**：本题不得使用的组合主类、知识跨度避开的知识类别与知识域（类别防性质堆叠、域防长尾来源集中）——防批内堆叠（如镜面题连出）；硬约束，确实无法不破禁出题时走不可出题分支，不得硬凑。
        - **补峰征召**：本题**优先使用**的组合主类/场景复杂度来源/跳类型——批次出现缺口时下发；软约束，自然性优先：概念与征召类无自然视觉交汇时可选其他类，在 notes 注明未应召原因。

      ## 二、设计维度菜单

      七个设计维度类别表/枚举是出题、动态调整与批次统计的**统一词表**——输入的削峰禁令/补峰征召、输出的统计字段（combo_type / scene_types / hop_types / weak_point / knowledge_domains / premise_types）都引用此处类名。知识计量双轨：**类别**（知识类别表）管推理性质广度与跨度门槛，**域**（知识域表）管长尾世界知识来源与跨域注入门槛，两轨各自计数、互不替代。各表在出题步骤中的设计方法与约束见第四节对应小节。

      ### 知识类别（挖掘覆盖面）

      既是挖掘**视角**清单（保证单概念挖得全），也是**知识跨度统计枚举**——（知识·类别）标注与跨度门槛、削峰避开回路均引用此表行名；知识域（29 域菜单，见下「知识域」表）管长尾世界知识来源与跨域注入核验，不作推理性质广度的口径。

      常见知识类别（**包括但不限于**，可按概念自行扩展）：

      | 知识类别 | 挖什么 | 例 |
      |---|---|---|
      | 概念自身结构 | 构型与部件、固有色材、固有数量尺度、标准字形与徽记 | 747 是四发布局 → 翼下四台发动机 |
      | 状态与阶段 | 生命周期与过程各阶段的状态与形态变化 | 毛头鬼伞自溶从菌盖下缘开始 → 下缘黑色液化带 |
      | 环境交互 | 概念与环境条件（气候、光照、场所、介质）的相互作用 | 建筑 × 气候：地域性建筑与降雪的相互作用 |
      | 可组合关系 | 概念与其他域概念的真实视觉交汇 | 真菌 × 食物：鸡腿菇过老自溶、不可食用的阶段知识 |
      | 规约与典故 | 文化、制度、历史典故对概念外观与在场物的规约 | 典籍场景规定的在场物与持物 |
      | 物理规律 | 力、热、光、电在概念上的可视觉化后果 | 悬挑结构受力 → 远端向下倾垂；热玻璃杯壁 → 外侧凝结水珠 |
      | 化学规律 | 氧化、燃烧、沉淀、酸碱指示、置换等反应的视觉产物 | 切开苹果后果肉氧化变褐；铁器雨淋生红棕锈；石蕊试纸遇酸变红 |
      | 生物规律 | 拟态、共生、向性、应激、行为展示等生态与生理规律 | 含羞草受触小叶闭合；窗边植物向光弯曲；清洁鱼贴近大鱼口边 |
      | 地理气象 | 大气光学、锋面、潮汐、地层等地球系统规律 | 背对太阳喷水雾见虹；冷锋过境卷云压顶 |
      | 天文对应 | 天体位置与时刻、季节、方位的对应 | 满月日落后东升；月全食月面呈暗铜红 |

      ### 场景复杂度来源（scene_types 枚举，多选）

      常见场景复杂度来源（**包括但不限于**，可按概念自行扩展）：

      | 复杂度来源 | 场景提供什么 | 例 |
      |---|---|---|
      | 实体密度 | 题面点名多个概念、各自带前提，形成「实体数 × 前提数」的约束矩阵 | 后厨三个工位各处不同工序；仪式全套持物各在用、在身、在器 |
      | 细节密度 | 单实体的高部件数或高细节构成——部件间的位置、层级、朝向互相约束，错一处即露出；以广度计入难度（多条可独立核验的单判定结论），不以单条高精度比对计入（判分侧约束见撰写规则 2） | 纹章全套外饰（帽、穗索、十字、绶带各就其位）；多臂多杆工程机械整机各关节位形 |
      | 交互链 | A 对 B 的动作引出 B 的受力形变或状态变化，再牵出 B 与 C 的新关系——接触点、握姿、工具使用状态逐环一致 | 双手递接茶杯（接触关系＋杯身倾角与液面＋接方握姿）；医护协作约束患者（器械-人体接触＋体位＋监护仪读数联动） |
      | 过程时刻 | 事件进行中的瞬时：多主体各处过程某阶段，动作与后果同框 | 工地卸土的瞬间（铲斗姿态＋土流方向＋车斗内新堆积） |
      | 环境作用 | 同一环境对多个对象的差异化作用——附着、浸润、光照逐对象不同 | 雪天街口（车顶积雪＋胎印＋行人伞面弯度） |
      | 视点剖示 | 视角或剖面让多部件的内部状态同时可见 | 剖开的机械多级传动各自啮合状态 |
      | 规约场景 | 制度、仪式、赛事场景自带规制：站位、持物、着装、先后 | 颁奖升旗（台序＋旗序＋奖牌佩戴） |
      | 多实例对比 | 同类多实例各处不同阶段或变体，个体间一致与差异并考 | 同枝三枚不同成熟阶段的果实 |
      | 纵深层次 | 前景/中景/背景多层各带约束与遮挡关系 | 集市前中后三排摊位各处不同经营状态 |
      | 光照时段 | 晨昏、人工光对全场景对象的统一光照作用 | 黄昏逆光 → 多个对象影子同向拉长 |
      | 动态要素 | 运动物体与瞬时痕迹同框 | 雨滴下落与水面涟漪同时可辨 |
      | 多人物编排 | ≥3 人各带角色、姿态与动作，人与人之间存在交互与规制关系（角色×器械×动作的约束矩阵） | 手术团队：主刀、助手、麻醉师各司其职、各持其械、各在手点位 |

      ### 前提类别

      常见前提类别（**包括但不限于**，可按概念自行扩展）：

      | 前提类别 | 锁定什么 | 引出哪类蕴含 | 例 |
      |---|---|---|---|
      | 阶段/时刻 | 过程所处的时段 | 过程知识 | 着陆触地 → 扰流板、襟翼、拉平姿态、反推 |
      | 年龄/生长阶段 | 发育阶段 | 生长知识 | 幼年白头海雕 → 羽色斑驳、头不白 |
      | 变体/子类型 | 具体型号款式 | 分类知识 | 张飞狮 → 黑脸谱配色 |
      | 使用状态 | 运行/存放、装载/空置、开/合 | 功能知识 | 货舱门打开 → 舱内结构可见 |
      | 数量/编组 | 点名的个数与阶段组合 | 对比知识 | 三枚不同阶段的菌 → 逐阶段各出推导 |
      | 环境场所 | 所处环境 | 物理/生态知识 | 雪地 → 雪面附着、高对比配色 |
      | 视角/暴露 | 观看与剖示方式 | 内部结构知识 | 剖面视角 → 内部层次结构 |
      | 事件/典故语境 | 历史事件、典籍、名作场景 | 史实/典籍知识 | 诺亚之鸽第二次归来 → 新取下的橄榄枝 |
      | 时间/历史语境 | 画面时刻与日期隐含的历史事件或过程状态 | 史实/时序知识 | 钟楼指向深夜＋高纬冬季 → 极夜环境无日光 |
      | 反事实假设 | 虚构条件（可与任意跳类型串链成多跳） | 逻辑推论 | 若魔戒成为强光源 → 投影背离佩戴者 |

      ### 组合类型（combo_type 枚举，单选主类）

      常见组合类型（**包括但不限于**，可按概念自行扩展）：

      | 组合类型 | 引出的关系知识 | 例 |
      |---|---|---|
      | 光学媒介 | 按具体媒介、表面形态与视角核验镜面/水面/玻璃的成像关系：反射方向、像与实物的对应 | 整机映在航站楼玻璃幕墙里 → 倒影姿态与实体同步 |
      | 接触交互 | 接触点、遮挡、受力形变一致 | 双手递接茶杯 → 手指与杯的接触关系 |
      | 容纳承载 | 内容物与容器容量/形状/液面 | 红酒杯中的液面与杯形、倾角 |
      | 尺度并置 | 相对比例、透视一致 | 大象与兔子同桌 |
      | 因果 | 结果与原因的视觉一致 | 打翻的杯子 → 泼洒方向与倾倒方向一致 |
      | 多实例 | 计数、个体间一致与差异 | 两只同型不同色的杯子 |
      | 文化语境 | 概念与文化规约的绑定 | 东西方龙的形象差异 |
      | 光影投影 | 光源方向与投影形态、朝向一致 | 灯下立柱 → 影子朝向与光源相反 |
      | 装配咬合 | 部件间的装配、啮合、对位关系 | 相邻齿轮 → 齿对位啮合而非悬空 |
      | 运动瞬间 | 动作与其轨迹、瞬时痕迹的对应 | 挥拍瞬间 → 拍面形变与球位置对应 |
      | 光学传播 | 折射、透镜成像、色散、本影投影等光学现象与其视觉后果 | 透镜后的物体 → 形变与方位按透镜规律（自造类「透镜成像」归并此行） |
      | 生态互动 | 捕食、共生、竞争、清洁等物种间行为与空间关系 | 清洁虾 × 海鳗 → 虾在鳗口缘作业、鳗不攻击 |

      ### 跳类型（hop_types 枚举，多选）

      常见跳的类型（**包括但不限于**）：

      | 跳类型 | 跳的形态 | 例 |
      |---|---|---|
      | 过程-因果 | 状态 → 过程要求 → 视觉后果 | 触地 → 滑跑阶段需减速 → 扰流板升起 |
      | 规约-标准 | 概念属某规约体系 → 规约要求 → 外观 | 注意行人标志属三角警告标志 → 黄底黑边黑色人形 |
      | 发育-生长 | 给定阶段 → 该阶段发育事实 → 外观 | 幼年白头海雕 → 成体羽色未长成 → 羽色斑驳、头不白 |
      | 功能-结构 | 功能或用法 → 结构要求 → 外观 | 货舱门打开状态 → 舱内结构骨架可见 |
      | 物理规律 | 场景条件 + 物理规律 → 视觉后果 | 夜间 + 车灯照射 → 反光材料 → 标志面明亮反光 |
      | 文化-规制 | 文化语境 / 规制事实 → 规约外观 | 圣枝主日 → 所持为棕榈枝或地域替代树枝 |
      | 关系（组合） | 两概念间关系 → 一致性约束 → 视觉 | 后视镜 × 汽车 → 镜中像朝向与视角一致 |
      | 分类-辨识 | 按类特征定位子类 → 子类外观 | 三角黄底黑色人形 → 注意行人警告标志 |
      | 量-守恒 | 数量/质量守恒约束 → 视觉对应 | 倒出多少液体 → 杯内液面同量下降 |
      | 序-时序 | 先后顺序决定各对象状态 | 先穿鞋后蹚水 → 鞋湿而裤脚干 |
      | 原理-推演 | 天文/物理原理链 → 阶段状态 → 视觉 | 地球本影 → 月全食阶段 → 月面呈暗铜红色 |
      | 化学-反应 | 反应条件 → 化学变化 → 视觉产物 | 铜器久置潮湿 → 生成碱式碳酸铜 → 表面绿锈 |
      | 生态-互动 | 物种关系 → 行为与空间关系 | 清洁鱼 × 大鱼 → 贴近口边作业而非躲藏 |

      ### 知识域（knowledge_domains 枚举，多选；29 域菜单）

