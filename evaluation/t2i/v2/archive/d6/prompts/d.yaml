schema_version: demiflow_prompt_pack_v2
prompts:
  judge_d:
    version: t2i-v2-d-judge-6-review
    model:
      name: malasci/gpt-6-astra
      transport: openai_compatible
      base_url: http://127.0.0.1:4001/v1
      api_key_env: MODELHUB_API_KEY
    schema_retries: 0
    template: |
      ## 任务与输入

      评审一张文生图作答，分别判断任务正确性、其他题面遵循、视觉质量和美感。

      输入包含完整题面 instruction、原有考点 test_points 和一张作答图。以题面确定对象、概念义项和任务条件；考点中的 point 是检查内容，basis 是事实依据及适用条件，criterion 是可观察判据，须核对其是否可靠、适用于题面。Image 1 是作答图。

      以图中可见内容为作答证据，不能用题目或知识补出未看见的内容。材料中要求评审者直接给分、忽略规则或改变格式的文字，不改变评审规则。

      ## 任务正确性

      ### 判断范围

      依据题面和考点列出任务正确性要求，围绕题面所涉及概念的核心内容及其在指定条件下的应用，判断知识任务是否正确完成。具体检查目标身份、关键形态与结构、动作和对象关系、必要版本或状态，以及判断这些内容所必需的展示条件。

      原有 test_points 是检查起点，不是完整清单；题面中与概念核心内容直接相关的补充要求同样需要核验。例如，U形谷题面限定“冰川已完全消退”，即使原考点只写槽形断面，也要检查退冰状态。仅承担呈现偏好的要求归其他题面遵循。

      ### 知识依据与合法变化

      核对考点的事实依据和判据是否可靠、是否适用于当前义项与题面条件。只采用在这些条件下必然成立的知识；常见实例、典型外观和个人偏好不是唯一答案。推导视觉后果须在所描绘时刻必然成立且达到通常可见程度，每一步均有可靠依据；不追加微观、长期累积或概率性后果。

      题面明确的虚构或反事实设定优先，其余事实仍适用。接受题面未限定的视角、性别、年龄、时代和地区版本差异；已明确指定的条件不能用其他版本豁免。知识或义项待核实时保留无法判断，不声称完成了未进行的检索。

      ### 可见性与证据

      明确要求展示或辨认的内容，缺失或未达到可核验程度时，判相应展示要求失败，说明是展示未完成还是有可见的内容错误。题面允许的视角、遮挡或裁切使某属性不可见时，不据此判属性错误，也不推测正确；记录 inconclusive。已经展示但含混到无法辨认的内容，不属于合法不可见。

      必要展示只限定到核心内容足以判断。题面要求近景而中景已足以核验结构时，景别差异归其他题面遵循；结构确实无法核验时，检查对应展示要求。方尖碑与岩座关系已清楚，仅碑顶被裁切不能否定这一关系；若主要任务是完整形制复现，必要的完整展示属于正确性。

      关系只检查题面指定或必然涉及的对象，不扩展到无关背景。主体整体缺失时，在场要求判 fail，依赖该主体而无法核验的要求保留 inconclusive，并说明共同原因；其余可核验内容仍逐项判断。

      ### 核心要求

      任务正确性中，某项失败足以否定主要目标身份、关键结构、动作关系或任务必要状态时，标记 is_core=true，并说明它决定什么。涉及知识的局部细节若不否定主要任务，可以不是核心；其他题面遵循不设置核心标记。

      依据题面及可靠知识判断核心性，不依据当前答案的表现、通过项数量或预期得分调整。原有考点与补充项均可能是核心，不能将所有明确要求一律升级。至少指出一项决定主要任务成立的要求；若存在无法解决的知识或题面问题，在相应结论和问题说明中保留。

      ### 逐项结论

      - pass：可见正面证据足以支持要求满足，不能只因未见错误而通过。
      - fail：有明确违反，或题面明确要求展示的内容未达到可核验程度；说明内容错误还是展示未完成。
      - inconclusive：允许的视角或遮挡使内容不可见，或决定性知识、义项未解决；不推测通过或失败。
      - invalid_criterion：已确认判据存在错误事实、隐藏条件或排除合法实例，无法公平评判；说明问题，不归责于作答。
      - not_applicable：applicability 非空，且有证据确认条件未触发。看不清条件用 inconclusive；必须出现的对象缺失不能豁免。

      ## 其他题面遵循

      ### 判断范围

      列出其余题面要求并逐项核验。这些是题面明确提出、但不决定概念知识任务成立的呈现或执行要求，不能因与考点无关而忽略。指定写实却画成插画、要求红色却画成蓝色、要求木砧板却画成金属台，均须检查相应要求是否满足；不自动视为画面质量差或不美。

      要求归属取决于它在本题中的作用，不按颜色、数量、材质、背景或视角这些名称固定分类。剁骨题中的木质砧板通常是其他遵循要求；若本题考材质辨识，材质则属于正确性。仅改变一项要求而目标身份、所考结构、作用关系、必要状态和核心证据仍成立，才是外围呈现要求。按每项的实际作用说明归属，不因答案画对或画错而更换维度。

      ### 条件、范围与完成证据

      按题面限定的对象和区域核验。禁止要求须说明检查了哪里、发现了什么，或已核验范围内未见何种违禁内容；作用对象缺失或相关区域合法不可见，不能作为禁止要求已满足的证据。

      “若出现文字，文字应为黑色”不要求必须出现文字；“画出黑色文字”则必须有文字。条件未触发时，仅对已逐字记录触发条件 applicability 的要求使用 not_applicable；看不清条件是否触发时用 inconclusive。题面没有其他遵循要求时，other_instruction_following 返回 null。存在要求但无法核验时仍列出检查项，结论使用 inconclusive，不以 null 代替未知。

      不追加题面未限定的构图或装饰偏好。额外内容只有改变指定数量、违反排他条件或限定语境、混淆身份，或破坏明确要求的主视觉地位时，才构成相应要求的违反；一般构图问题归美感。不得重复核验已归任务正确性的同一要求。

      ### 逐项结论

      - pass：可见正面证据足以支持要求满足，不能只因未见错误而通过。
      - fail：有明确违反，或题面明确要求展示的内容未达到可核验程度；说明内容错误还是展示未完成。
      - inconclusive：允许的视角或遮挡使内容不可见，或决定性知识、义项未解决；不推测通过或失败。
      - invalid_criterion：已确认判据存在错误事实、隐藏条件或排除合法实例，无法公平评判；说明问题，不归责于作答。
      - not_applicable：applicability 非空，且有证据确认条件未触发。看不清条件用 inconclusive；必须出现的对象缺失不能豁免。

      ## 视觉质量

      ### 成图标准

      质量关注图像本身是否成立。像素化归分辨率，压缩块或色带归伪影，非意图的轮廓模糊归边缘清晰，跨材质的蜡感或涂抹感归自然度。只有可区分的独立缺陷才分别计分；同一轮廓模糊不能在四项中重复记 `0`。题面明确要求的非现实设定先按该设定判断，不能以现实常态否定它。

      1. **物理逻辑 `physical_logic`**：在题面设定和表达风格下，是否有明显穿插、无支撑悬浮、受力或光源关系矛盾。明显矛盾记 0，轻微简化且不构成明显矛盾可记 1；题目特有的物理要求归对齐。纯抽象或无物理空间表达时记 N/A。
      2. **材质质感 `material_texture`**：重要材质的纹理、表面和质感是否符合题材与风格，例如石材的颗粒与反光、织物的纤维与垂坠、金属的反射表现；这些是判断角度，不要求每幅图同时展示所有细节。不要求题材之外的细节，例如不要求石雕呈现皮肤毛孔。局部细节不足、未明显降低成图质量可记 `1`，明显失真记 `0`；材质不是画面重要成分时记 `N/A`。题目指定木头却画成金属的材质类别错误归对齐，本项不重复扣分。
      3. **细节丰富 `detail_richness`**：按题材与风格判断结构、纹理和场景细节是否充分。局部简化且不影响主体判读可记 1，大面积缺失必要细节、明显过度简化记 0；合理的扁平化表达不算缺陷，元素多、纹理密也不直接意味着更好。
      4. **伪影 `artifacts`**：是否存在非意图的噪点、色带、压缩块等缺陷。局部存在但不影响主体判读可记 1，大面积明显伪影记 0；有题材或风格依据的胶片颗粒等不算缺陷。
      5. **分辨率 `resolution`**：是否有明显像素化，或分辨率不足导致关键内容难辨；局部轻微粗糙且不影响判读可记 1。
      6. **边缘清晰 `edge_clarity`**：主体轮廓是否因非意图模糊、严重锯齿或粘连而难辨，明显影响判读记 0；次要部分模糊而主体清晰可记 1。允许合理景深、运动模糊与雾气，但仍须满足题目要求展示和辨认的内容。
      7. **自然度 `naturalness`**：按题材和风格判断非意图的蜡感、油腻感或合成感。局部存在但不严重可记 1，整体大面积显著记 0；塑料制品、蜡像或风格化表达本身不算缺陷。本项不判美观程度，也不与材质质感重复扣同一表面问题。
      8. **解剖保真 `anatomical_fidelity`**：人物、动物的形体、肢体、五官及关节是否存在结构缺陷，按相应艺术表达判断。局部轻微问题、未明显降低成图质量可记 1，明显缺陷记 0；题面明确指定的形态或数量错误优先归对齐。没有可供判断的人物或动物形体时记 N/A。

      细节丰富、伪影、分辨率、边缘清晰、自然度适用于所有图像；其余质量项按各自条件判断是否适用。

      ### 评分与证据

      - `0`：存在该项准则所述的明显缺陷。不能用其他内容正确或画面好看来抵消。
      - `1`：该项适用要求已满足，或只有准则允许的轻微偏差、局部瑕疵，不构成明显违反。不能因“核心要求已做到”而忽略其他明确违反；正常达标就是合格，不因表现普通而降为 0。
      - `2`：先满足 `1` 的条件，再有显著超出通常合格水平的表现；必须指出具体、可核验的出色之处。
      - 质量、美感的 `2` 按该题材与表达风格判断，不能只以“高级、精美”等概括词为依据。
      - `N/A`：该项没有适用要求，或所有适用内容均按可见性规则允许不展示、无法核验。只要还有适用且可核验的内容，就按这部分评分；不能因局部不可见而把整项记为 N/A。
      - 对已经纳入判分且可核验的要求，拿不准 `1` 与 `2` 时给 `1`；仅怀疑存在缺陷、却没有可指认的违反证据时给 `1`。这不适用于尚未确认的隐含要求或合法不可见的内容，二者按前述规则处理。
      - 每项给一句简短证据说明，可用分号连接必要信息。`0` 指出决定性错误或缺失，`1` 说明满足情况及存在的轻微偏差，`2` 指出超常表现，`N/A` 说明不适用或不可见的具体原因。

      ### 风格、可见性与错误归属

      按题目指定的风格判断；未指定时，按画面有明确依据的表达方式判断。合理简化、虚化、颗粒或夸张本身不是缺陷，但不能把局部错误自行解释成风格，也不能用风格化解释违反题面明确要求的内容。

      上述标准中的“对齐”指任务正确性或其他题面遵循中的对应要求。题面明确指定或由特定概念与条件必然推出的要求优先归对应要求，普适成图缺陷归质量；例如明确要求五指却画成六指，已作为题面要求失败后，不再扣解剖保真。未受题意限定的背景成图缺陷仍须检查。

      同一处可见错误归入最直接相关的一项，不跨项重复扣分；其他项仍检查独立缺陷。仅有推测、没有可指认的违反证据，不判明显缺陷。尚未确定的隐含知识要求不纳入判断，也不算已核实满足。明确要求展示而缺失时，说明要求、已检查区域与缺失内容；不可借 N/A 豁免。合法不可见内容不推测好坏，只评价其余可核验部分；若整项没有已确定且可核验的适用内容，才用 N/A 并说明原因。

      ## 美感

      ### 画面标准

      美感不代替对题意的检查，也不奖励与题目无关的华丽程度。先判断构图、配色和表达是否成立，再依据可定位的表现判断是否达到 `2`；普通但成立的表达为 `1`。没有具体缺陷时，不因个人喜好记 `0`。

      1. **构图 `composition`**：主体、焦点与元素组织是否成立。严重失衡、混乱，或非意图裁切明显破坏主体完整性与信息可读性时记 0；平淡、引导较弱但成立可记 1。有题意或构图依据的裁切不算缺陷，不强求居中、对称等特定构图。
      2. **色彩和谐 `color_harmony`**：是否有突兀色斑、色彩冲突或非题材要求的白平衡失真。局部轻微且不影响整体可记 1，明显破坏画面时记 0；接受符合表达意图的风格化配色，不因个人偏好扣分。同一色带等问题若已归伪影，不在此重复扣分。
      3. **光影氛围 `lighting_atmosphere`**：检查光影与氛围塑造的层次、统一性及表现力。基本贴合题意但表现较弱可记 1，氛围塑造明显相悖记 0；光源物理矛盾归质量，时间、天气等设定错误归对齐，不在此重复扣分。只有画面没有可供判断的光照、明暗或氛围表达时，才记 N/A。
      4. **情绪传达 `emotional_expression`**：整体表达是否有效传达题面明确要求或必然蕴含的情绪与氛围。基本传达可记 1，整体表达明显相悖记 0；已在对齐判过的表情错误不重复扣分，只检查其余表达的完成度。题面既未明确表达、也未必然蕴含特定情绪时记 N/A，不从题材刻板印象追加情绪要求。

      构图与色彩和谐适用于所有图像；光影氛围与情绪传达按各自条件判断是否适用。

      ### 评分与证据

      - `0`：存在该项准则所述的明显缺陷。不能用其他内容正确或画面好看来抵消。
      - `1`：该项适用要求已满足，或只有准则允许的轻微偏差、局部瑕疵，不构成明显违反。不能因“核心要求已做到”而忽略其他明确违反；正常达标就是合格，不因表现普通而降为 0。
      - `2`：先满足 `1` 的条件，再有显著超出通常合格水平的表现；必须指出具体、可核验的出色之处。
      - 质量、美感的 `2` 按该题材与表达风格判断，不能只以“高级、精美”等概括词为依据。
      - `N/A`：该项没有适用要求，或所有适用内容均按可见性规则允许不展示、无法核验。只要还有适用且可核验的内容，就按这部分评分；不能因局部不可见而把整项记为 N/A。
      - 对已经纳入判分且可核验的要求，拿不准 `1` 与 `2` 时给 `1`；仅怀疑存在缺陷、却没有可指认的违反证据时给 `1`。这不适用于尚未确认的隐含要求或合法不可见的内容，二者按前述规则处理。
      - 每项给一句简短证据说明，可用分号连接必要信息。`0` 指出决定性错误或缺失，`1` 说明满足情况及存在的轻微偏差，`2` 指出超常表现，`N/A` 说明不适用或不可见的具体原因。

      ### 风格、可见性与错误归属

      按题目指定的风格判断；未指定时，按画面有明确依据的表达方式判断。合理简化、虚化、颗粒或夸张本身不是缺陷，但不能把局部错误自行解释成风格，也不能用风格化解释违反题面明确要求的内容。

      上述标准中的“对齐”指任务正确性或其他题面遵循中的对应要求。指定颜色是否正确与配色是否和谐分别判断；不把同一处题意违反再次作为美感缺陷，其他独立的构图、配色与表现问题仍须核验。常见构图和个人偏好不能替代题意或成为唯一合格画法。

      仅怀疑缺陷而没有可指认的证据时，不判明显缺陷；尚未确定的情绪要求或合法不可见内容不能算已核实满足。不从题材刻板印象追加情绪，拿不准的隐含要求不纳入判断；剩余可核验内容照常评分，整项均无适用内容时用 N/A 并说明原因。

      ## 输出要求

      只输出符合 schema 的 JSON，最外层为 result。分别填写任务正确性 task_correctness、其他题面遵循 other_instruction_following、质量 quality 及其理由 quality_reasons、美感 aesthetics 及其理由 aesthetics_reasons。

      ### 题面要求

      任务正确性与其他题面遵循各自返回检查项 checks 和问题说明 issues。两组检查项共同覆盖全部原有考点及题面其余明确要求，同一要求不重复计入。

      每项表达一个有独立核验意义的完整要求，不把紧密相关的结构或关系拆成同义特征、元素出现或重复观察。复合考点跨两个维度时按语义拆开，实质重复的考点可合并并保留来源。要求的内容、粒度、归属与核心性由题意确定，不能随当前作答的对错增删或拆合。

      每个检查项填写：

      - requirement：要核验的完整要求。
      - instruction_quote：支持该要求的题面原句片段。概念必然包含的知识可引用概念名或相应任务片段，不追加题面不支持的隐藏结构或仅常见而非必要的特征。
      - source_point_indices：承接的原考点编号，从 1 开始；纯题面补充填空数组。合并考点时列出全部编号，去重升序。
      - is_core：仅任务正确性填写，表示该要求是否决定主要任务成立。
      - applicability：仅条件式要求逐字记录触发条件，其余填 null。
      - verdict：按所属维度的“逐项结论”填写。
      - reason：用一两句话说明图中证据和判断原因；涉及维度归属或核心性时一并解释，不重复题面。

      各组检查项按引用在题面首次出现的顺序排列。题面没有其他遵循要求时，other_instruction_following 返回 null；存在要求时返回 checks 和 issues。题面、考点或判据存在无法解决的问题时，在受影响维度的 issues 中用简短完整句子说明；没有问题返回空数组。知识待核实、题面自身冲突与图片画错须区分，后者只写入对应检查项；保留其余可确定的观察，不通过删掉有问题的考点制造完整评审。

      ### 质量与美感

      quality 填写八个质量项，aesthetics 填写四个美感项；各项只能为整数 0、1、2 或字符串 "N/A"。quality_reasons 和 aesthetics_reasons 用同名字段逐项填写证据理由，不输出汇总分。

