# 独立CPU网关，绑定127.0.0.1:4002；原4001判分服务继续运行。
# OpenRouter新版Images API直接透传，凭据只从服务环境读取。
model_list: []
general_settings:
  pass_through_endpoints:
    - path: /openrouter/images
      target: https://openrouter.ai/api/v1/images
      headers:
        Authorization: Bearer os.environ/OPENROUTER_API_KEY
        Content-Type: application/json
      auth: false
      methods: [POST]
      timeout: 900
    - path: /openrouter/images/models
      target: https://openrouter.ai/api/v1/images/models
      headers:
        Authorization: Bearer os.environ/OPENROUTER_API_KEY
      auth: false
      methods: [GET]
      timeout: 60
litellm_settings:
  request_timeout: 900
router_settings:
  num_retries: 0
