<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>A/B/D · 逐题分维度明细</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#223249;background:#f4f6fa;font-size:14px}body{margin:0}main{max-width:1580px;margin:auto;padding:24px}h1{font-size:24px}p{line-height:1.7}.muted{color:#627189}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:8px;border:1px solid #bdc9d9;border-radius:6px;background:white}button{cursor:pointer}input{min-width:250px}.table-wrap{overflow:auto;background:white;border:1px solid #d8e0eb;border-radius:8px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1260px}th,td{padding:11px 9px;border-right:1px solid #e4e9f0;border-bottom:1px solid #e4e9f0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}thead th{background:#e8eef7;color:#324867;text-align:center;position:sticky;top:0}thead tr:nth-child(2) th{top:39px}.name{min-width:200px;max-width:285px;white-space:normal;text-align:left;position:sticky;left:0;background:white;z-index:1}.name summary{cursor:pointer;font-weight:600}.name details div{font-weight:400;line-height:1.7;padding-top:10px;min-width:260px}.mode{text-align:center;color:#465a78}.reference td{background:#f2f7fd}.reference .name{background:#f2f7fd}.question-start td{border-top:2px solid #c2d0e4}.score-null{color:#8792a2}.score-zero{color:#aa3746}.score-full{color:#117255}td.total{font-weight:700}.pager{display:flex;align-items:center;justify-content:center;gap:15px;margin:18px}.notes{background:#eaf0f8;padding:14px 18px;border-radius:8px}details.meta{margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.empty{text-align:center;padding:35px}#summary table{min-width:1260px}#summary{margin:18px 0}#summary small{color:#748198;font-weight:400}
</style></head><body><main><h1>A / B / D · 每题分维度得分</h1><p class="notes">每题两行：无参考图、正例参考图。满分100，A/B为已保存分数，D由同批已保存响应按各自协议重新计算，没有重新调用模型。B只有任务分；A对齐与B、D任务正确性采用各自标准。综合分的权重也各不相同。</p><div id="summary"></div><p class="muted">— 表示无法判定、不适用或缺少评分，不按0分计。悬停空分可查看原因；点击题目可展开完整题面。汇总括号内为有效题数。</p><div class="controls"><input id="search" placeholder="搜索题目或完整题面"><label>作答方式 <select id="mode"><option value="">两路一起</option><option value="text_only">无参考图</option><option value="positive_images">正例参考图</option></select></label><label>每页 <select id="page-size"><option value="10">10题</option><option value="15">15题</option><option value="30" selected>30题</option></select></label><button id="reset">重置</button><button id="download">下载完整CSV</button><span id="count"></span></div><div class="table-wrap"><table id="scores"><thead></thead><tbody></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button></div><details class="meta"><summary>固定来源与D计算版本</summary><pre id="metadata"></pre></details></main><script id="score-data" type="application/json">__SCORE_DATA__</script><script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('score-data').textContent),$=s=>document.getElementById(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>v==null?'—':Number(v).toFixed(2);const groups=[];for(const [key,label,group] of D.columns){if(groups.at(-1)?.label===group)groups.at(-1).count++;else groups.push({label:group,count:1});}
const head='<tr><th rowspan="2">题目</th><th rowspan="2">作答方式</th>'+groups.map(g=>`<th colspan="${g.count}">${esc(g.label)}</th>`).join('')+'</tr><tr>'+D.columns.map(([k,l])=>`<th data-column="${k}">${esc(l)}</th>`).join('')+'</tr>';$('scores').querySelector('thead').innerHTML=head;
$('summary').innerHTML='<details><summary>查看各维度均分与有效题数</summary><div class="table-wrap"><table><thead><tr><th>作答方式</th>'+D.columns.map(([k,l])=>`<th>${esc(l)}</th>`).join('')+'</tr></thead><tbody>'+Object.entries(D.summaries).map(([mode,values])=>'<tr><td>'+({text_only:'无参考图',positive_images:'正例参考图'})[mode]+'</td>'+D.columns.map(([k])=>`<td>${num(values[k].mean)} <small>(${values[k].valid})</small></td>`).join('')+'</tr>').join('')+'</tbody></table></div></details>';
let page=0;function render(){const query=$('search').value.trim().toLowerCase(),mode=$('mode').value,size=Number($('page-size').value);const rows=D.rows.filter(r=>(!mode||r.answer_mode===mode)&&(!query||(r.concept+' '+r.instruction).toLowerCase().includes(query)));const ids=[...new Set(rows.map(r=>r.task_id))],pages=Math.max(1,Math.ceil(ids.length/size));page=Math.min(page,pages-1);const visible=new Set(ids.slice(page*size,(page+1)*size));let previous=null;$('scores').querySelector('tbody').innerHTML=rows.filter(r=>visible.has(r.task_id)).map(r=>{const start=previous!==r.task_id;previous=r.task_id;return `<tr data-task="${esc(r.task_id)}" data-mode="${r.answer_mode}" class="${start?'question-start ':''}${r.answer_mode==='positive_images'?'reference':''}"><td class="name"><details><summary>${r.rank}. ${esc(r.concept)}</summary><div>${esc(r.instruction)}</div></details></td><td class="mode">${esc(r.mode)}</td>`+D.columns.map(([k])=>`<td data-column="${k}" class="${k.endsWith('overall')?'total ':''}${r[k]==null?'score-null':r[k]===0?'score-zero':r[k]===100?'score-full':''}" title="${esc(r.notes[k]||'')}">${num(r[k])}</td>`).join('')+'</tr>';}).join('')||'<tr><td class="empty" colspan="'+(D.columns.length+2)+'">没有匹配的题目</td></tr>';$('count').textContent=`${ids.length}题 · ${rows.length}行`;$('page-label').textContent=`${page+1} / ${pages} 页`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;}
for(const id of ['search','mode','page-size'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});$('reset').onclick=()=>{$('search').value='';$('mode').value='';$('page-size').value='30';page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('metadata').textContent=JSON.stringify(D.meta,null,2);
$('download').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const fields=[['rank','题号'],['concept','题目'],['mode','作答方式'],...D.columns.map(([k,l])=>[k,l]),['task_id','task_id'],['instruction','完整题面'],['d_scoring_revision','D计算版本']];const lines=[fields.map(([,l])=>quote(l)).join(',')+',"空分说明"',...D.rows.map(r=>fields.map(([k])=>quote(r[k])).join(',')+','+quote(JSON.stringify(r.notes)))];const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='A_B_D_逐题分维度.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();})();
</script></body></html>
