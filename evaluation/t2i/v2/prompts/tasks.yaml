      ## 八、计分说明（由代码执行）

      1. 沿用 V1 映射：`0 → 0`，`1 → 60`，`2 → 100`；N/A 不参与平均。
      2. 对齐、质量、美感分别计算均分，不合成总分。
      3. 某个维度全部为 N/A 时，该维度得分为 null。

      ## 本次输入

      题目：{{ instruction }}

